<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDLES × YouTube — What TANGK Taught Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   IDLES × YOUTUBE — TANGK REVIEW · DECK V1
   Built 4 Sep 2026 for the Partisan Records conversation.

   SOURCE OF TRUTH: IDLES_TANGK_Review_v1.md. Every figure on every
   slide traces to that document, which in turn traces to a single
   YouTube Data API v3 pull of 367/367 current uploads on 4 Sep 2026.
   If a number here is not in that document, it is an error.

   ── V2. WHAT CHANGED, AND WHY ─────────────────────────────────────
   V1 diagnosed TANGK. V2 keeps every one of those findings but moves
   the centre of gravity from "here's what TANGK didn't do" to "here's
   what we'd build with you next", and it does that on the back of a
   second source document: IDLES_Product_Activation_Audit_v1.md.

   THE AUDIT CHANGED THE RECOMMENDATION. We thought we were going to
   tell IDLES to build activation around their Premieres. It turns out
   THEY ALREADY DID THAT — 24 live broadcast events across four named
   series, and on 13 Dec 2021 a Premiere paired with a same-day
   47-minute Q&A about that song. Then it stopped. Zero live events in
   the whole TANGK campaign.

   So the deck is no longer teaching IDLES how to use YouTube. It is
   reconnecting behaviours they already had to the much stronger hero
   strategy they have now. That is slide 06 and it is the hinge of the
   whole thing.

   ── THE ARGUMENT, IN ORDER ────────────────────────────────────────
   02  TANGK worked at the top. Say so first and mean it.
   03  But uploads tripled while long-form destinations FELL.
   04  The gaps: 89 days / 1 destination. 30 days / 0. 61 days / 0.
   05  The reveal: ZERO owned live across the whole campaign.
   06  THE HINGE: you used to programme around the hero. 24 live
       events, four named series, and one Premiere+Q&A night.
   07  Don't make the lazy "more live" call. 26 owned live assets sit
       at a 10,010 median. Le Bataclan is the exception.
   08  Four actions, stated as actions — not "considerations".
   09  Stations and Afterparty: what VMG would pitch YouTube for.
   10  Turn the release into a moment, then give it somewhere to go.

   TONE RULE FOR V2: by slide 06 the deck must have turned from
   diagnosis to possibility. Partisan should leave thinking "we could
   do this", not "interesting audit".

   ── CLAIM DISCIPLINE, NON-NEGOTIABLE ──────────────────────────────
   Public API data only. NOTHING on retention, traffic sources,
   Browse/Suggested, subscriber conversion, unique or returning
   viewers, audience overlap, Shorts→long-form conversion, playlist
   routing, end screens, or incremental Premiere effect.

   Every view figure is CURRENT OBSERVED VIEWS — a lifetime snapshot,
   never campaign-period performance. Owned totals are FLOORS: 22.2m
   of channel lifetime sits in videos no longer public.

   CRAWLER is used for ARCHITECTURE ONLY. Its assets have had longer
   to accumulate current views, so cross-campaign view totals are not
   like-for-like and no slide compares them.

   The 16.7x Bataclan figure is a DESCRIPTION OF THE PAST, not an
   expected uplift. Slide 06 says "worth testing", never "will work".

   ── VISUAL SYSTEM ─────────────────────────────────────────────────
   Black ground, bone off-white, TANGK red. Archivo Black for the
   shouting, Barlow Condensed for structure, Inter for anything the
   reader has to actually read. Asymmetric, poster-like, deliberately
   imperfect alignment — gig poster and fanzine, not dashboard.
   No floating KPI cards. Numbers are set enormous and allowed to
   collide with things.
   ═══════════════════════════════════════════════════════════════ */

:root{
  --ink:#0A0A0A;
  --coal:#131113;
  --bone:#EDE9E3;
  --paper:#F5F2ED;
  --red:#E8232A;        /* TANGK red */
  --blush:#F2646A;
  --smoke:#8E8880;
  --hair:rgba(237,233,227,.15);
  --bonehair:rgba(10,10,10,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--bone);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.display{font-family:'Archivo Black','Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:-.022em;line-height:.9}
.display.big{font-size:clamp(2.4rem,7.4vw,6.1rem)}
.display.mid{font-size:clamp(1.5rem,3.6vw,2.8rem);line-height:.95}
.cond{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  font-weight:700;letter-spacing:.02em}

/* ── Chrome ─────────────────────────────────────────────────────── */
.chrome{position:fixed;top:0;left:0;right:0;height:3rem;z-index:60;
  display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;
  background:rgba(10,10,10,.85);border-bottom:1px solid var(--hair);
  backdrop-filter:blur(8px)}
.chrome-t{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--smoke)}
.btn{font:inherit;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;padding:.42rem 1rem;border-radius:0;
  border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer}
body.present .chrome{display:none}
body.present{overflow:hidden}
#pbar{position:fixed;top:0;left:0;height:3px;background:var(--red);z-index:70;
  width:100%;transform:scaleX(0);transform-origin:0 50%;transition:transform .3s}
#pcount{position:fixed;bottom:1rem;right:1.3rem;z-index:70;display:none;
  font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:700;
  letter-spacing:.16em;color:var(--smoke)}
body.present #pcount{display:block}

/* ── Slides ─────────────────────────────────────────────────────── */
.deck{padding-top:3rem}
.slide{min-height:100vh;display:flex;align-items:center;position:relative;
  padding:4.5rem 1.6rem;border-bottom:1px solid var(--hair);overflow:hidden}
.slide .inner{max-width:1280px;margin:0 auto;width:100%;position:relative;z-index:2}
.slide.bone{background:var(--paper);color:var(--ink)}
.slide.bone .display{color:var(--ink)}
.slide.red{background:var(--red);color:#fff}
.bleed{position:absolute;inset:0;z-index:0;overflow:hidden}
.bleed img{width:100%;height:100%;object-fit:cover}
.bleed::after{content:'';position:absolute;inset:0}

.label{font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:1rem}
.slide.red .label{color:#fff;opacity:.75}
.sub{font-size:clamp(.92rem,1.25vw,1.06rem);line-height:1.6;color:var(--smoke);
  max-width:60ch;margin-top:1.1rem}
.slide.bone .sub{color:#4A4640}
.slide.red .sub{color:rgba(255,255,255,.9)}

/* ── Source bar ─────────────────────────────────────────────────── */
.srcbar{margin-top:1.15rem;padding-top:.7rem;border-top:1px solid var(--hair)}
.slide.bone .srcbar{border-color:var(--bonehair)}
.slide.red .srcbar{border-color:rgba(255,255,255,.28)}
.src{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--smoke)}
.slide.red .src{color:rgba(255,255,255,.78)}

/* ── Cover ──────────────────────────────────────────────────────── */
.cover-wrap{position:relative}
.cover-x{font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:700;
  letter-spacing:.3em;text-transform:uppercase;color:var(--red)}

/* ── Big stat row ───────────────────────────────────────────────── */
.stats{display:flex;flex-wrap:wrap;gap:2.6rem;margin-top:1.5rem;align-items:flex-end}
.st-n{font-family:'Archivo Black',sans-serif;line-height:.82;
  font-size:clamp(2.6rem,7vw,5.4rem);color:var(--red)}
.slide.red .st-n{color:#fff}
.st-l{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--smoke);margin-top:.5rem;max-width:16ch}
.slide.bone .st-l{color:#5C5850}
.slide.red .st-l{color:rgba(255,255,255,.85)}

/* ── Four-panel hero strip (slide 02) ───────────────────────────────
   Contact-sheet treatment rather than four floating cards. The images
   butt against each other with a 2px gutter so it reads as one strip. */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:1.4rem}
@media(max-width:900px){.strip{grid-template-columns:repeat(2,1fr)}}
.pan{position:relative;overflow:hidden;background:#1A181A}
.pan img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;
  filter:grayscale(.28) contrast(1.06)}
.pan::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(10,10,10,.94),rgba(10,10,10,.15) 62%,transparent)}
.pan-m{position:absolute;left:.7rem;right:.7rem;bottom:.6rem;z-index:2}
.pan-v{font-family:'Archivo Black',sans-serif;font-size:clamp(1.15rem,2.5vw,1.9rem);
  line-height:.9;color:#fff}
.pan-t{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--red);margin-top:.28rem}

/* ── The contradiction (slide 03) ───────────────────────────────────
   127 is set enormous and 14 deliberately small next to it. The point
   is made by the SIZE RELATIONSHIP, not by the caption underneath. */
.contra{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem;margin-top:1.5rem;align-items:center}
@media(max-width:900px){.contra{grid-template-columns:1fr;gap:1.4rem}}
.cx{border-left:3px solid var(--hair);padding-left:1.3rem}
.cx.hot{border-left-color:var(--red)}
.cx-k{font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--smoke);margin-bottom:.5rem}
.cx-row{display:flex;align-items:baseline;gap:1.1rem;flex-wrap:wrap}
.huge{font-family:'Archivo Black',sans-serif;line-height:.8}
.huge.up{font-size:clamp(3.4rem,11vw,8.4rem);color:var(--bone)}
.huge.dn{font-size:clamp(1.5rem,3.4vw,2.6rem);color:var(--red)}
.cx-lab{font-family:'Barlow Condensed',sans-serif;font-size:.76rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);display:block;margin-top:.3rem}

/* ── Gap timeline (slide 04) ────────────────────────────────────────
   A tape strip, not a chart. Hero markers are solid red blocks; the
   gaps between them are the empty runs, labelled with what was
   actually in them. Reads top to bottom in about three seconds. */
.tape{margin-top:1.4rem;border-top:2px solid var(--red);padding-top:1.1rem}
.trow{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:1.4rem;
  align-items:center;padding:.55rem 0}
.thero{font-family:'Archivo Black',sans-serif;font-size:clamp(1rem,2.1vw,1.5rem);
  line-height:1;color:#fff;background:var(--red);padding:.42rem .7rem;white-space:nowrap}
.tgap{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
  border-left:2px dashed rgba(237,233,227,.3);padding-left:1.1rem;margin-left:.3rem}
.tg-d{font-family:'Archivo Black',sans-serif;font-size:clamp(1.3rem,3vw,2.2rem);
  line-height:1;color:var(--bone)}
.tg-w{font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--smoke)}
.tg-w b{color:var(--red);font-weight:700}

/* ── The zero (slide 05) ────────────────────────────────────────────
   The single most important number in the deck and it is a zero, so
   it gets the most space. Everything else on the slide is smaller
   than it by a wide margin. */
/* Capped at 16rem rather than 20rem. It still dominates the slide by a
   wide margin — the next largest thing on it is a 3rem headline — and
   the larger cap pushed the slide past unscaled fit at 982. */
.zero{font-family:'Archivo Black',sans-serif;line-height:.72;
  font-size:clamp(6rem,22vw,16rem);color:var(--red);margin:.1rem 0 .2rem}
.bbc{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:1.1rem}
@media(max-width:900px){.bbc{grid-template-columns:repeat(2,1fr)}}

/* ── Strike-through (slide 06) ──────────────────────────────────── */
.struck{position:relative;display:inline-block}
.struck::after{content:'';position:absolute;left:-1%;right:-1%;top:52%;height:8px;
  background:var(--red);transform:rotate(-1.6deg)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:1.4rem}
@media(max-width:900px){.vs{grid-template-columns:1fr;gap:1.2rem}}
.vs-c{padding:1rem 1.1rem;border:1px solid var(--hair)}
.vs-c.win{border-color:var(--red);background:rgba(232,35,42,.09)}
.vs-k{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--smoke)}
.vs-n{font-family:'Archivo Black',sans-serif;font-size:clamp(1.7rem,4vw,3rem);
  line-height:.9;margin-top:.4rem}
.vs-c.win .vs-n{color:var(--red)}
.vs-s{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);margin-top:.35rem}
.bat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:1.1rem}
@media(max-width:900px){.bat-strip{grid-template-columns:repeat(2,1fr)}}
.bat-strip img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
  filter:grayscale(.5) contrast(1.1)}

/* ── The model (slide 07) ───────────────────────────────────────── */
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;margin-top:1.4rem}
@media(max-width:900px){.model{grid-template-columns:1fr}}
.mo{border-top:3px solid var(--hair);padding-top:.85rem}
.mo.one{border-top-color:var(--red)}
.mo.two{border-top-color:var(--red)}
.mo-k{font-family:'Barlow Condensed',sans-serif;font-size:.76rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.mo.three .mo-k{color:var(--smoke)}
.mo-t{font-family:'Archivo Black',sans-serif;font-size:clamp(1.05rem,2.3vw,1.6rem);
  line-height:.98;text-transform:uppercase;margin-top:.35rem}
.mo-d{font-size:.86rem;color:var(--smoke);line-height:1.55;margin-top:.5rem}
.feeds{margin-top:1.2rem;padding-top:.85rem;border-top:1px solid var(--hair);
  font-family:'Barlow Condensed',sans-serif;font-size:.86rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--smoke)}
.feeds b{color:var(--bone);font-weight:700}

/* ── Shorts collage (slide 08) ──────────────────────────────────────
   Vertical crops, uneven vertical offsets — a pinboard, not a grid.
   The offsets are intentional; do not "fix" them to a straight line. */
.pins{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-top:1.3rem}
@media(max-width:900px){.pins{grid-template-columns:repeat(3,1fr)}}
.pin{position:relative;overflow:hidden;background:#1A181A}
.pin:nth-child(2){transform:translateY(14px)}
.pin:nth-child(3){transform:translateY(-8px)}
.pin:nth-child(4){transform:translateY(18px)}
.pin:nth-child(5){transform:translateY(4px)}
.pin img{width:100%;aspect-ratio:9/13;object-fit:cover;display:block;
  filter:grayscale(.2) contrast(1.05)}
.pin::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(10,10,10,.92),transparent 58%)}
.pin-m{position:absolute;left:.5rem;right:.5rem;bottom:.5rem;z-index:2}
.pin-v{font-family:'Archivo Black',sans-serif;font-size:clamp(.85rem,1.6vw,1.15rem);
  line-height:.95;color:var(--red)}
.pin-t{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-top:.18rem;line-height:1.15}

/* ── V2: THE HINGE (slide 06) ────────────────────────────────────────
   Two-part slide. The top is the dormant capability as raw counts; the
   bottom is the one night they did it, shown as two real thumbnails
   with an arrow between them. The night is the proof that the
   recommendation is a restoration, not an invention. */
.past{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem;margin-top:1.3rem}
@media(max-width:900px){.past{grid-template-columns:repeat(2,1fr)}}
.pa-n{font-family:'Archivo Black',sans-serif;font-size:clamp(2rem,5vw,3.6rem);
  line-height:.85;color:var(--bone)}
.pa-n.dead{color:var(--red)}
.pa-l{font-family:'Barlow Condensed',sans-serif;font-size:.76rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);margin-top:.45rem;max-width:18ch}
.night{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:1.1rem;
  align-items:center;margin-top:1.3rem;padding-top:1.1rem;border-top:2px solid var(--red)}
@media(max-width:900px){.night{grid-template-columns:1fr;gap:.7rem}}
.ni{position:relative;overflow:hidden;background:#1A181A}
.ni img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;filter:grayscale(.3) contrast(1.06)}
.ni::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(10,10,10,.92),transparent 62%)}
.ni-m{position:absolute;left:.75rem;right:.75rem;bottom:.6rem;z-index:2}
.ni-v{font-family:'Archivo Black',sans-serif;font-size:clamp(1rem,2.1vw,1.5rem);line-height:.9;color:var(--red)}
.ni-t{font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-top:.22rem;line-height:1.1}
.ni-s{font-size:.62rem;color:#B9B3AA;margin-top:.15rem;line-height:1.35}
.ni-arrow{font-family:'Archivo Black',sans-serif;font-size:clamp(1.4rem,3vw,2.4rem);color:var(--red)}
@media(max-width:900px){.ni-arrow{transform:rotate(90deg)}}

/* ── V2: THE FOUR ACTIONS (slide 08) ─────────────────────────────────
   Numbered rows, not cards. Action 01 is styled the same as the others
   on purpose — "keep" is as much of an instruction as "build". */
.acts{display:grid;gap:.55rem;margin-top:1.2rem}
.act{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:1.1rem;align-items:baseline;
  padding:.7rem .9rem;border-left:3px solid var(--red);background:rgba(232,35,42,.07)}
@media(max-width:900px){.act{grid-template-columns:auto 1fr}.act p{grid-column:1/-1}}
.act-n{font-family:'Archivo Black',sans-serif;font-size:clamp(.95rem,1.9vw,1.3rem);
  color:var(--red);line-height:1}
.act-k{font-family:'Barlow Condensed',sans-serif;font-size:.74rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--smoke);min-width:9ch}
.act-t{font-family:'Archivo Black',sans-serif;font-size:clamp(.95rem,1.9vw,1.35rem);
  text-transform:uppercase;line-height:1}
.act-d{font-size:.8rem;color:var(--smoke);line-height:1.5;margin-top:.2rem}
.hier{margin-top:1.1rem;padding-top:.8rem;border-top:1px solid var(--hair);
  font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--smoke);line-height:1.7}
.hier b{color:var(--bone)}

/* ── V2: THE PITCH (slide 09) ────────────────────────────────────────
   Two columns: what VMG would pitch, and the inventory that makes the
   Stations case unusual. The BETA/PITCH badge is non-negotiable — it
   is what stops this reading as a feature IDLES can switch on. */
.pitch{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.6rem;margin-top:1.2rem}
@media(max-width:900px){.pitch{grid-template-columns:1fr}}
.pbadge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:.62rem;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);
  padding:.26rem .5rem;margin-bottom:.6rem}
.pitem{border-top:2px solid var(--red);padding-top:.7rem;margin-bottom:1rem}
.pi-t{font-family:'Archivo Black',sans-serif;font-size:clamp(1rem,2.1vw,1.5rem);
  text-transform:uppercase;line-height:1}
.pi-d{font-size:.78rem;color:var(--smoke);line-height:1.55;margin-top:.35rem}
.inv{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;margin-top:.6rem}
.inv .pan img{aspect-ratio:16/10}
.metref{position:relative;overflow:hidden;border:1px solid var(--hair)}
.metref img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;filter:grayscale(.55) contrast(1.08)}
.metref::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(10,10,10,.9),transparent 60%)}
.metref-m{position:absolute;left:.7rem;right:.7rem;bottom:.55rem;z-index:2}

/* ── V2: THE MOMENT MAP (slide 10) ───────────────────────────────────
   Vertical run. Each step is one line. Bracketed steps are the ones
   that depend on a VMG pitch and are marked so nobody reads them as
   available today. */
.run{margin-top:1.2rem;border-left:2px solid var(--red);padding-left:1.3rem}
.step{padding:.5rem 0}
.st-k{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.st-t{font-family:'Archivo Black',sans-serif;font-size:clamp(.95rem,2vw,1.4rem);
  text-transform:uppercase;line-height:1.02;margin-top:.18rem}
.st-t.soft{color:var(--smoke)}
.st-d{font-size:.74rem;color:var(--smoke);line-height:1.45;margin-top:.15rem}
.miniPins{display:flex;gap:.35rem;margin-top:.45rem}

/* ── Reveal ─────────────────────────────────────────────────────── */
.reveal,.stagger>*{opacity:0;transform:translateY(14px);
  transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.reveal.in,.stagger.in>*{opacity:1;transform:none}
.stagger.in>*:nth-child(2){transition-delay:.07s}
.stagger.in>*:nth-child(3){transition-delay:.14s}
.stagger.in>*:nth-child(4){transition-delay:.21s}
.stagger.in>*:nth-child(5){transition-delay:.28s}
.pin,.pan{transition:none}
.stagger.in>.pin,.stagger.in>.pan{opacity:1}

/* ── Present mode ───────────────────────────────────────────────── */
body.present .deck{padding-top:0}
body.present .slide{display:none;height:100vh;min-height:100vh}
body.present .slide.active{display:flex}
body.present .reveal,body.present .stagger>*{opacity:1;transform:none}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════

const A = {

  /* CRAWLER used for ARCHITECTURE ONLY — never view totals. Its assets

  crawler:{ uploads:43, longForm:21, shortsPct:'51%' },
  tangk:{   uploads:127, longForm:14, shortsPct:'89%' },

  /* The gaps. Each figure is a date difference from the upload record,

  bbc:[
    { id:'LLCy9Ic9aIQ', t:'Dancer · Glastonbury',  v:'724K' },
    { id:'OYymMu2WoDM', t:'Gift Horse · Jools',    v:'576K' },
    { id:'3NqFrrj0Pcg', t:'Gratitude · Glastonbury', v:'225K' },
    { id:'yKdHXNq4rko', t:'A Gospel · Jools',      v:'184K' },
  ],
  bbcTotal:'1.71M',

  /* The Bataclan exception. 16.7x is a DESCRIPTION OF WHAT HAPPENED,
     not a forecast. Slide 06 says "worth testing" and must keep
     saying that — never "will deliver".                             */
  bataclan:[ '0lbH_Z-Xi1Q','jc4XigR4HaQ','aU0RhVzp268','ggFrG6Wliiw' ],
  liveOther:{ n:'26 assets', med:'10K median' },
  liveBat:{   n:'5 assets',  med:'167K median' },
  multiple:'16.7×',

  /* Personality Shorts. The point is NOT that personality causes
     performance — it is that the clearest breakouts looked like the
     band rather than like promotion.                                */
  pins:[
    { id:'G2Wm-FLWTx0', t:'Flynn!',                  v:'699K' },
    { id:'BO-_X0Av7G8', t:"Who's the best Dancer?",  v:'221K' },
    { id:'vzxVnIQ1878', t:'All is love.',            v:'202K' },
    { id:'_rUdHbvT8ws', t:'Hello!',                  v:'197K' },
    { id:'Rp0F4L6CtHk', t:'I kissed a boy…',         v:'122K' },
  ],
  shortsN:'113', shortsMed:'17K',

  /* ── V2: THE HINGE (slide 06) ─────────────────────────────────────
     All VERIFIED from the activation audit. IDLES ran 24 live
     broadcast events across four named series between Apr 2020 and
     Dec 2021, then none at all during TANGK.

    premiereAdoption:'13 / 13',
    night:{
      mv:{ id:'nyLlswYB_zY', t:'When The Lights Come On', s:'Official video · premiere', v:'982K' },
      qa:{ id:'vB2P3eaUPm8', t:'Q&A with Lee Kiernan', s:'Live · 47 minutes · same day', v:'17K' },
      date:'13 December 2021',
    },
    /* Real inventory, shown to make the Stations argument concrete. */
    inventory:[
      { id:'hHsbPcYdi34', t:'BALLEY TV', s:'7 episodes' },
      { id:'XBdspjpXBm4', t:'Live Q&As',  s:'5 broadcasts' },
      { id:'0lbH_Z-Xi1Q', t:'Le Bataclan', s:'Full concert film' },
      { id:'jc4XigR4HaQ', t:'Live songs',  s:'30 owned live assets' },
    ],
  },

  /* ── V2: THE FOUR ACTIONS (slide 08) ──────────────────────────────
     Stated as actions, not considerations. Action 01 is deliberately
     "keep" — IDLES are better at Premieres than most of the roster and
     the deck must never imply otherwise.                            */
  actions:[
    { n:'01', k:'Keep', t:'Premiere every major video',
      d:'13 of 13 official videos since 2021. All four TANGK heroes. Already exceptional — change nothing.' },
    { n:'02', k:'Build', t:'One owned live world',
      d:'One recognisable album-era place. Not random live uploads, not a weekly series.' },
    { n:'03', k:'Restore', t:'The night around the premiere',
      d:'Premiere, then a live moment the same night. You did exactly this in December 2021.' },
    { n:'04', k:'Programme', t:'The channel itself',
      d:'Live, archive, performance and band world, given one programmed home.' },
  ],

  /* ── V2: THE PITCH LAYER (slide 09) ───────────────────────────────
     CRITICAL SEPARATION. Creator features IDLES can switch on
     themselves are NOT the same as partner products VMG must broker,
     and the deck must not present them with equal certainty.

     Metallica is a PROGRAMMING reference only. No view counts, no
     scale comparison, no suggestion IDLES should copy them.

     Afterparty: the audit found NO evidence in mapped public campaign

const thumb = (id,q='hqdefault') => `https://i.ytimg.com/vi/${id}/${q}.jpg`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ═══════════════════════════════════════════════════════════════════
   SLIDES — nine. Each one job.
   ═══════════════════════════════════════════════════════════════ */
const slides = () => [

/* 01 ── COVER ──────────────────────────────────────────────────────
   No stats, no paragraph. This is a record campaign presentation, not
   a research summary, and the first slide should feel like one.    */
`<section class="slide" data-t="Cover">
  <div class="bleed"><img src="${thumb('A3ZZj5y6Qt4','maxresdefault')}" alt=""
    onerror="this.src='${thumb('A3ZZj5y6Qt4')}'"
    style="filter:grayscale(.55) contrast(1.1);opacity:.42"></div>
  <div class="inner cover-wrap">
    <div class="cover-x">IDLES × YouTube</div>
    <h1 class="display reveal" style="font-size:clamp(2.8rem,10vw,8rem);margin-top:1.1rem">
      What TANGK<br>taught us.<br>
      <span style="color:var(--red)">What we'd try next.</span></h1>
    <div class="srcbar reveal" style="margin-top:2rem;max-width:34ch">
      <span class="src">TANGK → next album · Partisan Records</span></div>
  </div>
</section>`,

/* 02 ── THE HEROES WORKED ──────────────────────────────────────────
   Credit first. The strategy Partisan chose was correct and the deck
   has to say so plainly before it says anything else — otherwise the
   room hears criticism and stops listening.                        */
`<section class="slide" data-t="Heroes">
  <div class="inner">
    <div class="label reveal">TANGK · what worked</div>
    <h2 class="display big reveal" style="max-width:16ch">Four videos did<br>
      <span style="color:var(--red)">most of the work.</span></h2>
    <div class="stats stagger">
      <div><div class="st-n">${A.heroCount}</div><div class="st-l">Official music videos</div></div>
      <div><div class="st-n">${A.heroTotal}</div><div class="st-l">Current observed views</div></div>
      <div><div class="st-n">${A.heroShare}</div><div class="st-l">Of campaign viewing</div></div>
    </div>
    <div class="strip stagger">
      ${A.heroes.map(h=>`
        <div class="pan"><img src="${thumb(h.id,'maxresdefault')}" alt="${esc(h.t)}"
          onerror="this.src='${thumb(h.id)}'">
          <div class="pan-m"><div class="pan-v">${h.v}</div>
            <div class="pan-t">${esc(h.t)}</div></div></div>`).join('')}
    </div>
    <h3 class="display mid reveal" style="margin-top:1.3rem">When the music arrived big,
      <span style="color:var(--red)">people watched.</span></h3>
    <div class="srcbar reveal"><span class="src">Four official videos = 3.1% of campaign uploads ·
      current observed views, public YouTube data, 4 Sep 2026</span></div>
  </div>
</section>`,

/* 03 ── THE CONTRADICTION ──────────────────────────────────────────
   Architecture only. No view totals anywhere near this slide — the
   CRAWLER assets are older and comparing their view counts to TANGK's
   would not be like-for-like.                                       */
`<section class="slide bone" data-t="Contradiction">
  <div class="inner">
    <div class="label reveal">TANGK · under the heroes</div>
    <h2 class="display big reveal" style="max-width:14ch">More active.<br>
      <span style="color:var(--red)">Fewer destinations.</span></h2>
    <div class="contra stagger">
      <div class="cx">
        <div class="cx-k">Crawler</div>
        <div class="cx-row">
          <div><span class="huge up" style="color:var(--ink)">${A.crawler.uploads}</span>
            <span class="cx-lab">Uploads</span></div>
          <div><span class="huge dn">${A.crawler.longForm}</span>
            <span class="cx-lab">Long-form destinations</span></div>
        </div>
        <div class="cx-lab" style="margin-top:.7rem">${A.crawler.shortsPct} Shorts</div>
      </div>
      <div class="cx hot">
        <div class="cx-k" style="color:var(--red)">TANGK</div>
        <div class="cx-row">
          <div><span class="huge up" style="color:var(--ink)">${A.tangk.uploads}</span>
            <span class="cx-lab">Uploads</span></div>
          <div><span class="huge dn">${A.tangk.longForm}</span>
            <span class="cx-lab">Long-form destinations</span></div>
        </div>
        <div class="cx-lab" style="margin-top:.7rem">${A.tangk.shortsPct} Shorts</div>
      </div>
    </div>
    <h3 class="display mid reveal" style="margin-top:1.4rem;max-width:34ch">More activity didn't mean
      <span style="color:var(--red)">more places to watch.</span></h3>
    <div class="srcbar reveal"><span class="src">Campaign architecture only · CRAWLER assets have had
      longer to accumulate current views, so cross-campaign view totals are not like-for-like and are
      not compared here</span></div>
  </div>
</section>`,

/* 04 ── THE GAPS ───────────────────────────────────────────────────
   Tape strip. Must be readable in five seconds: red block = hero,
   dashed run = the gap, and what was actually in it. Never says
   Shorts failed and never claims audience was lost — this is
   observed architecture, nothing more.                             */
`<section class="slide" data-t="The gaps">
  <div class="inner">
    <div class="label reveal">TANGK · between the videos</div>
    <h2 class="display big reveal" style="max-width:15ch">Busy.<br>
      <span style="color:var(--red)">But between the videos?</span></h2>
    <div class="tape stagger">
      ${A.gaps.map(g=>`
        <div class="trow">

            <span class="tg-w">${esc(g.shorts)} · <b>${esc(g.dest)}</b></span></div>
        </div>`).join('')}
      <div class="trow"><div class="thero">${esc(A.lastHero)}</div><div></div></div>

    <h3 class="display mid reveal" style="margin-top:1.3rem;max-width:32ch">The calendar was full.
      <span style="color:var(--red)">The music destinations weren't.</span></h3>
    <div class="srcbar reveal"><span class="src">Gaps measured between official video releases ·
      destinations counted as long-form uploads only · observed campaign structure, not a claim
      about audience behaviour</span></div>
  </div>
</section>`,

/* 05 ── THE ZERO ───────────────────────────────────────────────────
   The reveal. The zero gets more space than anything else in the deck
   because it is the finding Partisan is least likely to have framed
   this way. The BBC is presented as a strength, never as a problem,
   and the deck never suggests those views could have transferred.  */
`<section class="slide" data-t="Zero live">

    <div class="bbc stagger">
      ${A.bbc.map(b=>`
        <div class="pan"><img src="${thumb(b.id,'maxresdefault')}" alt="${esc(b.t)}"

          <div class="pan-m"><div class="pan-v">${b.v}</div>

      no claim that this viewing could have accrued elsewhere</span></div>
  </div>
</section>`,

/* 06 ── THE HINGE ──────────────────────────────────────────────────
   THE MOST IMPORTANT SLIDE IN V2 AND THE POINT THE DECK TURNS.

   Everything before this is diagnosis. Everything after is possibility.
   The finding — that IDLES already ran 24 live events, four named
   series, and one Premiere+Q&A night — converts the entire
   recommendation from "here is a thing you should try" into "here is
   a thing you already did".

   Do not soften "0". It is the whole rhetorical move: enormous
   capability, then nothing, across a campaign where they premiered
   every single video.

   All figures VERIFIED in IDLES_Product_Activation_Audit_v1.md.     */
`<section class="slide" data-t="You used to">
  <div class="inner">
    <div class="label reveal">And here's the thing</div>
    <h2 class="display big reveal" style="max-width:19ch">You already premiere everything.<br>

      <div><div class="pa-n">${A.past.premiereAdoption}</div><div class="pa-l">Videos premiered since 2021</div></div>
      <div><div class="pa-n dead">${A.past.duringTangk}</div><div class="pa-l">Live events during TANGK</div></div>
    </div>
    <div class="night stagger">
      <a class="ni" href="https://www.youtube.com/watch?v=${A.past.night.mv.id}" target="_blank" rel="noopener">
        <img src="${thumb(A.past.night.mv.id,'maxresdefault')}" alt=""
          onerror="this.src='${thumb(A.past.night.mv.id)}'">
        <div class="ni-m"><div class="ni-v">${A.past.night.mv.v}</div>
          <div class="ni-t">${esc(A.past.night.mv.t)}</div>
          <div class="ni-s">${esc(A.past.night.mv.s)}</div></div></a>
      <div class="ni-arrow">→</div>
      <a class="ni" href="https://www.youtube.com/watch?v=${A.past.night.qa.id}" target="_blank" rel="noopener">
        <img src="${thumb(A.past.night.qa.id,'maxresdefault')}" alt=""
          onerror="this.src='${thumb(A.past.night.qa.id)}'">
        <div class="ni-m"><div class="ni-v">${A.past.night.qa.v}</div>
          <div class="ni-t">${esc(A.past.night.qa.t)}</div>
          <div class="ni-s">${esc(A.past.night.qa.s)}</div></div></a>
    </div>
    <h3 class="display mid reveal" style="margin-top:1.2rem">${esc(A.past.night.date)}.
      <span style="color:var(--red)">That's the bit that stopped.</span></h3>
    <div class="srcbar reveal"><span class="src">Live broadcast events verified from the upload
      record · ${esc(A.past.span)} · the only premiere paired with a same-day live moment in the
      channel's history</span></div>
  </div>
</section>`,

/* 07 ── NOT THE LAZY ANSWER ────────────────────────────────────────
   The most important slide. Without it the room walks out with "make
   more live videos", which IDLES' OWN DATA REJECTS — 26 owned live
   assets at a 10,010 median.

   The 16.7x is descriptive. It is what already happened, on n=5,
   with assets 6-7 years old. Never present it as expected uplift and
   never claim production caused the performance.                    */
`<section class="slide bone" data-t="One live world">
  <div class="inner">
    <div class="label reveal">The recommendation</div>
    <h2 class="display big reveal" style="max-width:18ch">
      <span class="struck">So… more live videos?</span></h2>
    <h2 class="display big reveal" style="color:var(--red);margin-top:.7rem">Not quite.</h2>
    <div class="vs stagger">
      <div class="vs-c">
        <div class="vs-k">Other owned live</div>
        <div class="vs-n" style="color:var(--ink)">${A.liveOther.med}</div>
        <div class="vs-s">${A.liveOther.n}</div>
      </div>
      <div class="vs-c win">
        <div class="vs-k">Le Bataclan</div>
        <div class="vs-n">${A.liveBat.med}</div>
        <div class="vs-s">${A.liveBat.n} · ${A.multiple} the rest</div>
      </div>
    </div>
    <div class="bat-strip stagger">
      ${A.bataclan.map(id=>`<img src="${thumb(id,'maxresdefault')}" alt="Le Bataclan"
        onerror="this.src='${thumb(id)}'">`).join('')}
    </div>
    <h3 class="display mid reveal" style="margin-top:1.2rem;max-width:34ch">Don't make more live content.
      <span style="color:var(--red)">Build one live world.</span></h3>
    <div class="srcbar reveal"><span class="src">One night · one name · one world · full concert plus
      individual songs · Le Bataclan is the clearest positive exception in the owned live catalogue —
      a pattern worth testing, on five assets six to seven years old, not a predicted uplift</span></div>
  </div>
</section>`,

/* 08 ── THE FOUR ACTIONS ───────────────────────────────────────────
   Stated as actions, not "considerations" or a "framework". Partisan
   should be able to read this slide and know precisely what we are
   proposing.

   ACTION 01 IS "KEEP" ON PURPOSE. IDLES premiere better than most of
   the roster and the deck must never imply we are introducing them to
   the feature. Leading with what they already do well is also what
   earns permission for actions 02-04.

   The hierarchy line at the bottom is where the Shorts finding now
   lives — V1 gave it a whole slide, which made the deck too long once
   the hinge and the pitch layer were added.                        */
`<section class="slide" data-t="Four actions">
  <div class="inner">
    <div class="label reveal">Next album</div>
    <h2 class="display big reveal" style="max-width:17ch">For the next album,
      <span style="color:var(--red)">we'd do four things.</span></h2>

          <div><div class="act-t">${esc(a.t)}</div><p class="act-d">${esc(a.d)}</p></div>
        </div>`).join('')}
    </div>
    <div class="hier reveal">
      <b>Hero videos</b> = the release · <b>Performance</b> = the second music moment ·
      <b>Shorts</b> = the band · <b>Station</b> = the programmed world
    </div>
  </div>
</section>`,

/* 09 ── THE PITCH LAYER ────────────────────────────────────────────
   THE SEPARATION ON THIS SLIDE IS THE WHOLE POINT. Everything on it
   is a PARTNER opportunity VMG would broker with YouTube — not a
   feature IDLES can switch on. The red BETA / PITCH badges carry that
   and must not be removed.

   METALLICA IS A PROGRAMMING REFERENCE ONLY. No view counts, no scale
   comparison, no "IDLES should copy Metallica". The reference is
   about product behaviour: turning an artist's live and archive
   material into a programmed destination.

   AFTERPARTY WORDING IS EXACT AND MUST STAY EXACT. The audit found no
   evidence in mapped public campaign material. That is NOT the same as
   "IDLES have never done one" — an Afterparty is Premium-gated and may
   never surface as a public upload. Do not tighten this into a
   negative claim.

   The Stations argument is genuinely strong here and it is worth
   protecting: most artists pitching for Stations would be proposing to
   programme a library they have not made. IDLES already have theirs.  */
`<section class="slide bone" data-t="The pitch">
  <div class="inner">
    <div class="label reveal">What VMG would take to YouTube</div>
    <h2 class="display big reveal" style="max-width:20ch">The asset is one half.
      <span style="color:var(--red)">Programming is the other.</span></h2>
    <div class="pitch stagger">
      <div>
        <div class="pitem">
          <span class="pbadge">Beta · VMG to pitch</span>
          <div class="pi-t">YouTube Stations</div>
          <p class="pi-d">A programmed home for live, archive, performance and band world —
            alongside the hero videos. You wouldn't be building the library from nothing.
            <strong style="color:var(--ink)">${esc(A.pitch.stationsWhy)}.</strong></p>

        <div class="pitem">
          <span class="pbadge">Pitch opportunity</span>

            what you already do — every video premiered, and a history of live Q&amp;As.

      <div>
        <a class="metref" href="https://www.youtube.com/watch?v=${A.pitch.metallica.id}"
          target="_blank" rel="noopener">
          <img src="${thumb(A.pitch.metallica.id,'maxresdefault')}" alt="Metallica TV"
            onerror="this.src='${thumb(A.pitch.metallica.id)}'">
          <div class="metref-m"><div class="ni-t" style="color:#fff">${esc(A.pitch.metallica.label)}</div>
            <div class="ni-s">A reference for turning an artist's live and archive material into a
              programmed destination</div></div>
        </a>
        <div class="inv">
          ${A.past.inventory.map(i=>`
            <div class="pan"><img src="${thumb(i.id,'maxresdefault')}" alt="${esc(i.t)}"
              onerror="this.src='${thumb(i.id)}'">
              <div class="pan-m"><div class="pan-t" style="color:var(--red)">${esc(i.t)}</div>

    </div>
    <div class="srcbar reveal"><span class="src">Both are partner opportunities, not features to
      switch on — access is not guaranteed · Metallica referenced for programming behaviour only,

/* 10 ── THE MOMENT MAP · CLOSE ─────────────────────────────────────
   The slide Partisan should photograph. One release, mapped end to
   end, so the whole recommendation is legible in one look.

   Bracketed steps depend on a VMG pitch and are styled soft and
   labelled "if secured" so nobody plans around something we have not
   got yet. The Shorts imagery lives here now — it keeps the band in
   the room right at the close, which V1 got right and V2 should not
   lose just because the Shorts slide was folded away.              */
`<section class="slide red" data-t="The moment">
  <div class="inner">
    <div class="label reveal" style="color:#fff;opacity:.8">The shape of one release</div>

      <div class="step"><div class="st-k" style="color:#fff">Across the campaign</div>
        <div class="st-t" style="color:#fff;opacity:.72">Programmed destination · Station <span style="opacity:.8">if secured</span></div></div>

      <span style="opacity:.75">somewhere to go.</span></h3>

      Keep the hero · Build the live world · Programme the destination · Let Shorts show the band</div>
  </div>
</section>`,
];

/* ═══════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
document.getElementById('deck').innerHTML = slides().join('');

const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting) e.target.classList.add('in');
}),{threshold:.14});
document.querySelectorAll('.reveal,.stagger').forEach(el=>io.observe(el));

/* ── Presentation mode ─────────────────────────────────────────── */
let cur = 0;
const allSlides = () => [...document.querySelectorAll('.slide')];
function startPresent(){
  document.body.classList.add('present');
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  showSlide(0);
}
function exitPresent(){
  document.body.classList.remove('present');
  allSlides().forEach(s=>s.classList.remove('active'));
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
function showSlide(i){
  const S = allSlides();
  cur = Math.max(0, Math.min(S.length-1, i));
  S.forEach((s,n)=>s.classList.toggle('active', n===cur));
  const pb=document.getElementById('pbar');
  if(pb) pb.style.transform='scaleX('+((cur+1)/S.length)+')';
  const pc=document.getElementById('pcount');
  if(pc) pc.textContent=(cur+1)+' / '+S.length;
  fitActive();
  allSlides()[cur].querySelectorAll('img').forEach(img=>{
    if(!img.complete) img.addEventListener('load', fitActive, { once:true });
  });
}
document.addEventListener('keydown', e=>{
  if(!document.body.classList.contains('present')) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); showSlide(cur+1); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); showSlide(cur-1); }
  if(e.key==='Escape') exitPresent();
});

/* Fit the active slide to whatever screen it lands on. Decks get shown
   on laptops, not on the 1080p frame they were designed against — a
   14" MacBook is 982px tall. The whole slide scales as one object so
   nothing reflows and nothing rewraps. A slide that already fits is
   left completely alone. */
function fitActive(){
  if(!document.body.classList.contains('present')) return;
  const el = allSlides()[cur]; if(!el) return;
  const inner = el.querySelector('.inner'); if(!inner) return;
  inner.style.transform = '';
  const cs = getComputedStyle(el);
  const avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const need = inner.scrollHeight;
  if(avail > 0 && need > avail){
    const k = Math.max(0.72, avail / need);
    inner.style.transformOrigin = 'center center';
    inner.style.transform = 'scale(' + k.toFixed(4) + ')';
  }
}
let fitTimer;
window.addEventListener('resize', ()=>{ clearTimeout(fitTimer); fitTimer=setTimeout(fitActive,120); });
document.addEventListener('fullscreenchange', ()=> setTimeout(fitActive,260));
</script>
