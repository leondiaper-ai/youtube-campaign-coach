<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHVRCHES × YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   CHVRCHES × YOUTUBE — the next album campaign

   Identity is deliberately its own: cold near-black, bleached paper,
   electric magenta as the single accent with a cyan second. Nothing
   borrowed from the Amyl or Kings of Leon decks except the structure,
   because the argument here is different — this channel is dormant and
   still earning, which is the opposite of a channel that is publishing
   into silence.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --ink:#08070D;
  --coal:#0F0E17;
  --paper:#F3F1F7;
  --bone:#DAD6E4;
  --signal:#FF2D78;   /* electric magenta */
  --cyan:#3DE0D5;     /* cold second accent */
  --smoke:#8B87A0;
  --hair:rgba(243,241,247,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.display{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.02}
.big{font-size:clamp(2rem,4.8vw,4rem)}
.mid{font-size:clamp(1.5rem,3.4vw,2.7rem)}

.deck{width:100%}
.slide{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;
  padding:5.5rem 0 4rem;border-bottom:1px solid var(--hair)}
.slide.light{background:var(--paper);color:var(--ink)}
.slide.light .display{color:var(--ink)}
.slide.coal{background:var(--coal)}
.inner{width:100%;max-width:1180px;margin:0 auto;padding:0 2.4rem;position:relative;z-index:2}
.bleed{position:absolute;inset:0;z-index:0}
.bleed img{width:100%;height:100%;object-fit:cover;opacity:.62}
.bleed::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(8,7,13,.95) 0%,rgba(8,7,13,.78) 38%,rgba(8,7,13,.34) 72%,rgba(8,7,13,.22) 100%)}
/* Cover and closing statements carry less text, so the image can come further forward. */
.bleed.strong img{opacity:.78}
.bleed.strong::after{background:
  linear-gradient(90deg,rgba(8,7,13,.9) 0%,rgba(8,7,13,.62) 42%,rgba(8,7,13,.2) 78%,rgba(8,7,13,.08) 100%),
  linear-gradient(180deg,rgba(8,7,13,.75) 0%,transparent 26%,transparent 74%,rgba(8,7,13,.6) 100%)}

.label{font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--signal);margin-bottom:1.1rem}
.sub{font-size:.88rem;line-height:1.68;color:var(--smoke);margin-top:1.1rem;max-width:70ch}
.slide.light .sub{color:#5A5670}
.statement{font-size:clamp(1rem,1.8vw,1.4rem);line-height:1.45;font-weight:500}

.stat .num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.9rem,3.6vw,3rem);
  line-height:1;color:var(--paper)}
.slide.light .stat .num{color:var(--ink)}
.stat .cap{font-size:.68rem;color:var(--smoke);margin-top:.4rem;max-width:22ch;line-height:1.45}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .75s ease,transform .75s ease}
.reveal.visible{opacity:1;transform:none}
.stagger>*{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.stagger>*.visible{opacity:1;transform:none}
body.present .reveal,body.present .stagger>*{opacity:1;transform:none}

.cols{display:grid;gap:1.1rem;margin-top:1.8rem}
.card{border:1px solid var(--hair);border-radius:11px;padding:1.15rem 1.1rem;
  background:rgba(243,241,247,.03)}
.slide.light .card{border-color:var(--bone);background:#fff}
.card.key{border-color:var(--signal)}
.card.cy{border-color:var(--cyan)}
.c-h{font-size:.58rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--smoke);margin-bottom:.55rem}
.card.key .c-h{color:var(--signal)}
.card.cy .c-h{color:var(--cyan)}
.c-n{font-family:'Space Grotesk',sans-serif;font-size:2.5rem;line-height:.95;font-weight:700;color:var(--signal)}
.card.cy .c-n{color:var(--cyan)}
.slide.light .c-n{color:var(--signal)}
.c-l{font-size:.7rem;color:var(--smoke);line-height:1.45;margin-top:.5rem}
.c-b{font-size:.76rem;line-height:1.55;margin-top:.5rem}

.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:1.4rem}
.wall img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;display:block}
.wc{position:relative}
.wl{position:absolute;left:.35rem;bottom:.3rem;font-size:.5rem;font-weight:700;color:#fff;
  text-shadow:0 1px 5px rgba(0,0,0,.95)}

.bigthumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem;margin-top:1.7rem}
.tcard{display:block;border:1px solid var(--hair);border-radius:11px;overflow:hidden;
  text-decoration:none;color:inherit;background:rgba(243,241,247,.03);transition:border-color .18s,transform .18s}
.slide.light .tcard{border-color:var(--bone);background:#fff}
.tcard:hover{border-color:var(--signal);transform:translateY(-2px)}
.tcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.tmeta{padding:.7rem .85rem}
.ttitle{font-size:.75rem;font-weight:600;line-height:1.3}
.tviews{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.15rem;color:var(--signal);margin-top:.3rem}
.tsub{font-size:.62rem;color:var(--smoke);margin-top:.15rem}

.jr{margin-top:1.5rem;display:flex;flex-direction:column;gap:.45rem}
.jr-s{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:center;
  border:1px solid var(--hair);border-radius:8px;padding:.75rem .95rem;background:rgba(243,241,247,.03)}
.slide.light .jr-s{border-color:var(--bone);background:#fff}
.jr-s.key{border-color:var(--signal)}
.jr-n{font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:700;color:var(--signal);white-space:nowrap}
.jr-t{font-size:.86rem;font-weight:600;line-height:1.3}
.jr-d{font-size:.68rem;color:var(--smoke);margin-top:.15rem;line-height:1.45}
.jr-ar{text-align:center;color:var(--signal);font-size:.8rem;line-height:1}

.rec{display:grid;grid-template-columns:2.2rem 1fr;gap:1rem;padding:.85rem 0;
  border-top:1px solid var(--hair)}
.slide.light .rec{border-top-color:var(--bone)}
.rec-n{font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:700;color:var(--signal);padding-top:.15rem}
.rec-t{font-size:.98rem;font-weight:700;line-height:1.3}
.rec-a{font-size:.75rem;color:var(--smoke);margin-top:.22rem;line-height:1.5}

.flow{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.5rem}
.fs{flex:1 0 140px;border:1px solid var(--hair);border-radius:8px;padding:.85rem .8rem;
  background:rgba(243,241,247,.03)}
.slide.light .fs{border-color:var(--bone);background:#fff}
.fs.key{border-color:var(--signal)}
.fs-w{font-size:.55rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--signal);margin-bottom:.4rem}
.fs-t{font-size:.8rem;font-weight:700;line-height:1.3}

.lift{margin-top:1.3rem;display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.lift-h{font-size:.55rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cyan);margin-right:.35rem}
.lift-p{font-size:.62rem;padding:.2rem .55rem;border:1px solid var(--hair);border-radius:20px;color:var(--smoke)}
.slide.light .lift-p{border-color:var(--bone)}

/* ── Full-bleed statement slides ─────────────────────────────────── */
.huge{font-family:'Space Grotesk',sans-serif;font-weight:700;line-height:.86;letter-spacing:-.03em;
  font-size:clamp(4.5rem,15vw,13rem)}
.huge-l{font-size:clamp(.75rem,1.5vw,1.05rem);font-weight:500;color:var(--smoke);
  letter-spacing:.02em;margin-top:.3rem}
.split{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5rem;align-items:end;margin-top:1rem}

/* ── Catalogue mosaic ────────────────────────────────────────────── */
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-top:1.6rem}
.mo{position:relative;border-radius:8px;overflow:hidden;display:block;text-decoration:none;color:inherit}
.mo img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;transition:transform .3s}
.mo:hover img{transform:scale(1.04)}
.mo::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,7,13,.92) 0%,rgba(8,7,13,.15) 55%,transparent 100%)}
.mo-m{position:absolute;left:.7rem;right:.7rem;bottom:.6rem;z-index:2}
.mo-t{font-size:.72rem;font-weight:600;color:#fff;line-height:1.25}
.mo-v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.25rem;color:var(--signal);line-height:1.1}

/* ── Campaign sequence ───────────────────────────────────────────── */
.seq{display:flex;align-items:stretch;gap:.5rem;margin-top:1.6rem;flex-wrap:wrap}
.seq-i{flex:1 1 150px;position:relative;border-radius:8px;overflow:hidden}
.seq-i img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.seq-i::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,7,13,.9),transparent 62%)}
.seq-m{position:absolute;left:.55rem;right:.55rem;bottom:.45rem;z-index:2}
.seq-d{font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
.seq-t{font-size:.68rem;font-weight:600;color:#fff;line-height:1.25;margin-top:.1rem}
.seq-v{font-size:.6rem;color:rgba(243,241,247,.72)}
.seq-ar{align-self:center;color:var(--signal);font-size:1.05rem}

/* ── Format jobs with real frames ────────────────────────────────── */
.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:1.6rem}
.job{border:1px solid var(--hair);border-radius:10px;overflow:hidden;background:rgba(243,241,247,.03)}
.slide.light .job{border-color:var(--bone);background:#fff}
.job.key{border-color:var(--signal)}
.job img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.job-b{padding:.7rem .8rem}
.job-n{font-size:.56rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--smoke)}
.job.key .job-n{color:var(--signal)}
.job-t{font-size:.85rem;font-weight:700;line-height:1.25;margin-top:.2rem}
.job-d{font-size:.65rem;color:var(--smoke);line-height:1.45;margin-top:.25rem}

/* ── Station wall ────────────────────────────────────────────────── */
.swall{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:1.4rem}
.sw{position:relative;border-radius:5px;overflow:hidden}
.sw img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.sw::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(8,7,13,.85),transparent 60%)}
.sw-t{position:absolute;left:.4rem;bottom:.3rem;z-index:2;font-size:.55rem;font-weight:600;color:#fff}

@media(max-width:860px){
  .mosaic,.jobs{grid-template-columns:repeat(2,1fr)}
  .swall{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr;gap:1.6rem}
}
/* ── Station: the reference, and the always-on run ───────────────── */
.ref{display:block;border:1px solid var(--hair);border-radius:12px;overflow:hidden;
  text-decoration:none;color:inherit;background:rgba(243,241,247,.03);transition:border-color .18s}
.ref:hover{border-color:var(--cyan)}
.ref img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ref-b{padding:.85rem 1rem}
.ref-k{font-size:.55rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.ref-t{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700;margin-top:.25rem}
.ref-d{font-size:.68rem;color:var(--smoke);line-height:1.5;margin-top:.3rem}
.sw.slot{aspect-ratio:16/9;border:1.5px dashed var(--signal);border-radius:5px;
  background:rgba(255,45,120,.09);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.2rem;text-align:center;padding:.4rem}
.sw.slot::after{display:none}
.slot-p{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;color:var(--signal);line-height:1}
.slot-t{font-size:.56rem;font-weight:600;color:var(--signal);letter-spacing:.03em}
.run{display:flex;align-items:center;gap:.5rem;margin-top:.9rem;font-size:.6rem;color:var(--smoke)}
.run i{width:10px;height:10px;border-radius:2px;display:inline-block}
.srcbar{margin-top:1.5rem;padding-top:.8rem;border-top:1px solid var(--hair)}
.slide.light .srcbar{border-top-color:var(--bone)}
.src{font-size:.6rem;color:var(--smoke);letter-spacing:.03em}

.chrome{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;
  align-items:center;padding:.85rem 1.6rem;background:rgba(8,7,13,.82);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
body.present .chrome{display:none}
.chrome-l{font-size:.6rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke)}
.chrome-r{display:flex;gap:.5rem}
.btn{font:inherit;font-size:.66rem;font-weight:600;padding:.45rem .9rem;border-radius:6px;
  border:1px solid var(--hair);background:transparent;color:var(--paper);cursor:pointer}
.btn:hover{border-color:var(--signal);color:var(--signal)}
.pbar{position:fixed;top:0;left:0;height:2px;background:var(--signal);z-index:60;width:0}
.pcount{position:fixed;bottom:1.2rem;right:1.6rem;z-index:50;font-size:.62rem;color:var(--smoke);
  font-family:'Space Grotesk',sans-serif}
.phint{position:fixed;bottom:1.2rem;left:1.6rem;z-index:50;font-size:.58rem;color:var(--smoke);display:none}
body.present .phint{display:block}
body.present .slide{scroll-snap-align:start}
body.present .deck{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}

.sheet{position:fixed;inset:0;z-index:80;background:var(--paper);color:var(--ink);
  overflow-y:auto;display:none;padding:3rem 2rem}
.sheet.open{display:block}
.sheet-in{max-width:940px;margin:0 auto}
.sheet h2{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;margin-bottom:.3rem}
.sheet h3{font-family:'Space Grotesk',sans-serif;font-size:1rem;margin:2rem 0 .6rem;color:var(--signal)}
.sheet table{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:.6rem}
.sheet th{text-align:left;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--smoke);padding:.4rem .5rem;border-bottom:1px solid var(--bone);white-space:nowrap}
.sheet th.n{text-align:right}
.sheet td{padding:.4rem .5rem;border-bottom:1px solid #EDEAF3}
.sheet td.n{text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:500;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet td.sub{color:var(--smoke);font-size:.72rem}
.sheet tr.group td{border-top:1px solid var(--bone)}
.sheet p{font-size:.78rem;line-height:1.65;color:#5A5670;margin-bottom:.5rem}
.sheet .close{position:sticky;top:0;float:right;font-size:.7rem;padding:.4rem .9rem;border:1px solid var(--bone);
  border-radius:6px;background:#fff;cursor:pointer}

@media(max-width:960px){
  .wall{grid-template-columns:repeat(2,1fr)}
  .bigthumbs{grid-template-columns:1fr}
}
</style>
</head>

<div class="pbar" id="pbar"></div>
<div class="chrome">
  <div class="chrome-l">CHVRCHES × YouTube — the next album</div>
  <div class="chrome-r">
    <button class="btn" onclick="togglePresent()">Present</button>
    <button class="btn" onclick="openSheet('appendix')">Analysis</button>
  </div>
</div>
<div class="pcount" id="pcount"></div>
<div class="phint">← → navigate · esc exit</div>

<div class="deck" id="deck"></div>
<div class="sheet" id="sheet-appendix"><div class="sheet-in" id="appendixBody"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   DATA — every figure retrieved from the YouTube Data API v3 on
   26 Aug 2026 via /api/full-catalogue?handle=@chvrches and
   /api/artist-live?slug=chvrches. No YouTube Studio data is used.

   Album five is INFERRED from two Shorts on the channel. There is no
   confirmed title, date or tracklist, and nothing in this deck assumes
   one. Where a recommendation depends on timing it is expressed
   relative to release, never as a calendar date.
   ═══════════════════════════════════════════════════════════════════ */
const ARTIST = {
  meta:{ slug:'chvrches', apiBase:'https://youtube-campaign-coach.vercel.app/api/artist-live',
         capturedAt:'26 Aug 2026' },

    subscribers:549000, lifetimeViews:316658266, publicVideoCount:90,

    subsDelta:1000, subsFrom:548000, subsTo:549000,

     on some heritage channels. Top 1 is 14.1%, not 36%. */

  ],

  /* Format returns across the whole retrieved catalogue. */
  formats:[
    ['Music video',44,'168.8M',73.6,'937K'],
    ['Lyric video',11,'33.0M',14.4,'2.04M'],
    ['Audio',15,'22.1M',9.6,'392K'],
    ['Live',15,'4.1M',1.8,'104K'],
    ['Shorts',38,'897K',0.4,'22K'],
  ],
  lyricMedian:'2.04M', mvMedian:'937K', lyricN:11, mvN:44,
  topLyric:[
    {id:'fB4gjiMVKFI',t:'Warning Call',v:6857586,y:2016},
    {id:'RJdOYscmlyo',t:'Forever',v:6446790,y:2020},

  ],

  /* Screen Violence, the last album campaign. Window established from
     upload behaviour: first single 22 Apr 2021, album 27 Aug 2021
     (seven album assets published that day, plus the ONE WEEK
     CELEBRATION stream six days later). */
  last:{
    album:'27 Aug 2021', opens:'22 Apr 2021', lead:127,
    albumDayAssets:7, albumDayViews:'6.94M',
    singles:[
      {id:'fyyiJc0Wk2M',t:'He Said She Said',v:2876339,d:'22 Apr',party:{id:'058_PrUU2tg',v:26583,min:13}},
      {id:'7U_LhzgwJ4U',t:'How Not To Drown',v:7993559,d:'3 Jun',party:{id:'0XoMu7Bz7YE',v:30383,min:19}},
      {id:'du4kNAyjVCg',t:'Good Girls',v:4596808,d:'15 Jul',party:{id:'tOygf0t0amc',v:17883,min:19}},

    over:{id:'8ecVwQIUTHA',t:'Over',v:3605474,d:'24 Feb 2023',party:{id:'ECjhy15xwz0',v:16217,min:14}},

  chv5:[

  lowLift:['Channel homepage','Playlists','Archive live','Community posts',
           'Catalogue clips','Existing footage','End screens','Catalogue sequencing'],

  /* Music videos remain the hero format — 73.6% of visible viewing.

     comparison: song popularity, asset age and which track got which
     treatment are all uncontrolled. It supports one component of the

  /* Different formats, different jobs. */
  jobs:[

document.getElementById('deck').innerHTML = slides().join('');

function allSlides(){ return [...document.querySelectorAll('.slide')]; }

function observeAll(){
  const ro = new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('visible'); o.unobserve(e.target); }
  }),{threshold:.15});
  document.querySelectorAll('.reveal:not(.visible)').forEach(el=>ro.observe(el));

  const so = new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){
      [...e.target.children].forEach((c,i)=>setTimeout(()=>c.classList.add('visible'), i*80));
      o.unobserve(e.target);
    }
  }),{threshold:.1});
  document.querySelectorAll('.stagger').forEach(el=>so.observe(el));
}

/* ── Progress + counter ────────────────────────────────────────── */
function updateProgress(){
  const h = document.documentElement;
  const p = h.scrollTop / Math.max(1,(h.scrollHeight - h.clientHeight));
  document.getElementById('pbar').style.width = (p*100)+'%';
  const S = allSlides();
  const i = S.findIndex(s=>s.getBoundingClientRect().bottom > window.innerHeight*0.5);
  document.getElementById('pcount').textContent =
    (i<0?S.length:i+1) + ' / ' + S.length;
}
window.addEventListener('scroll', updateProgress, {passive:true});
window.addEventListener('resize', updateProgress);

/* ── Presentation mode ─────────────────────────────────────────── */
function togglePresent(){
  document.body.classList.toggle('present');
  document.querySelectorAll('.reveal,.stagger>*').forEach(e=>e.classList.add('visible'));
  updateProgress();
}
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') document.body.classList.remove('present');
  if(!document.body.classList.contains('present')) return;
  const S = allSlides();
  const i = S.findIndex(s=>s.getBoundingClientRect().top > window.innerHeight*0.5);
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
    e.preventDefault(); (S[i] || S[S.length-1]).scrollIntoView({behavior:'smooth'});
  }
  if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
    e.preventDefault();
    const cur = i<0 ? S.length-1 : i-1;
    (S[Math.max(0,cur-1)] || S[0]).scrollIntoView({behavior:'smooth'});
  }
});

/* ── Live refresh ──────────────────────────────────────────────── */
async function refreshLive(){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 7000);
    const r = await fetch(`${A.meta.apiBase}?slug=${A.meta.slug}`, {cache:'no-store', signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('status '+r.status);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    A.liveData = d.state || null;
    renderStats();
  }catch(e){
    console.warn('[CHVRCHES deck] live refresh unavailable — keeping captured data', e.message);
  }
}

function renderStats(){
  const views = liveOr('viewCount', C.lifetimeViews);
  ['liveLifetime'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = fmt(views.v);
  });
}

/* ── Init ──────────────────────────────────────────────────────────
   observeAll() runs FIRST and unguarded. Everything starts at
   opacity:0 and is revealed by observers, so anything that throws
   above it renders a blank deck. The live layer is optional and must
   never be able to take the presentation down with it.            */
observeAll();
updateProgress();
try{ renderStats(); }catch(e){ console.warn('[deck] stats unavailable', e); }
try{ refreshLive(); }catch(e){ console.warn('[deck] live refresh unavailable', e); }
</script>
