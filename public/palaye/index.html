<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palaye Royale × YouTube — The Album Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   PALAYE ROYALE × YOUTUBE — THE ALBUM CAMPAIGN

   Figures from a YouTube Data API v3 pull taken 2 September 2026 across
   three channels: @PalayeRoyale (340 of 340 uploads), @SumerianRecords
   (3,664 uploads, of which 114 are Palaye Royale), and the auto-generated
   Palaye Royale - Topic channel (154 tracks). No Studio or Analytics data.

   AUDIENCE: artist and management. Everything is framed as what is
   available to build on. Sumerian is treated throughout as a reach
   partner that has built something valuable, never as a problem.

   ── THE CORRECTION THAT PRODUCED THIS VERSION ──────────────────────
   An earlier build argued that Palaye's recent music videos "didn't land
   on the artist channel" and that the four upcoming videos should be
   placed there. That was WRONG and is now removed entirely.

   The videos exist. Feel Something, Great. (717,799) and Sad Generation
   (529,008) are official videos on Sumerian, and both outperformed their
   Topic audio pages. The old deck's 990,211 figure counted only the audio
   surfaces and understated the true response by 56%.

   Mapped ecosystem, CONSISTENT BASIS, all three the sum of currently
   visible uploads (4 Sep 2026): Sumerian 142,510,177 · artist channel
   37,762,412 · Topic 21,239,143 = 201,511,732. Verified ZERO shared video
   IDs across the three, so the sum is of distinct uploads — but it is
   always described as CURRENT OBSERVED VIEWS across THREE MAPPED
   destinations, never as total Palaye YouTube views and NEVER as an
   audience. Views are not people.

   The earlier 222,160,315 was withdrawn. It used the artist channel's
   lifetime `viewCount` of 58,617,481 while the other two rows were
   per-video sums — so it counted ~20.9m of views on deleted or private
   videos on one row only. Collaborator surfaces remain unmapped.

   NEVER claim: that views were lost or diverted to the label; that the
   videos were uploaded in the wrong place; that the artist channel would
   have done better; that the hybrid model will increase views; that
   Royal Television converts subscribers; that Shorts route to long-form.
   None of that is supported by public data.

   Royal Television is 69 REAL EPISODES, not 84 — 15 of the 84 matching
   uploads are 17-45 second promo clips. Season 05 is 12 episodes at a
   median of 22,318. Both the earlier 12,682 median and the "~3.7x a
   recent Short" comparison are gone: the first mixed promo clips in with
   episodes, and the second was never age-matched. The all-time median of
   31,888 and the "nine times a Short" line are also gone.

   THE FORMAT HIERARCHY (slide 7) is the spine of this revision. Three
   formats, three jobs: music video = hero (Sumerian), Royal Television =
   story, live/performance = the second music moment. Shorts support them;
   lyric and visualiser are response-led only. This replaced a flat menu
   of seven equally-weighted tiles, and it must not drift back into one.

   The peer research behind it (YUNGBLUD, BMTH, Bad Omens and others)
   stays OFF the artist-facing surface by instruction. It lives in
   PalayeRoyale_Strategy_Research_v1.md.
   ═══════════════════════════════════════════════════════════════════ */

:root{
  --ink:#08070A;           /* near-black ground */
  --coal:#0F0D13;
  --paper:#F2EFEA;         /* bone */
  --bone:#D8D2C9;
  --smoke:#8B8590;
  --signal:#C4162E;        /* oxblood — the band's own register */
  --gold:#C9A227;          /* used once, on the owned-asset slide */
  --hair:rgba(242,239,234,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.display{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:-.01em;line-height:.94;margin:0}
.display.big{font-size:clamp(2.3rem,6.4vw,5.3rem)}
.display.mid{font-size:clamp(1.5rem,3.5vw,2.9rem)}

/* ── Chrome ─────────────────────────────────────────────────────── */
.chrome{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;
  align-items:center;justify-content:space-between;padding:.85rem 1.6rem;
  background:rgba(8,7,10,.82);border-bottom:1px solid var(--hair)}
.chrome-t{font-size:.6rem;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--smoke)}
.btn{font:inherit;font-size:.62rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:.5rem .9rem;border-radius:99px;border:1px solid var(--hair);
  background:transparent;color:var(--paper);cursor:pointer}
.btn.on{background:var(--signal);border-color:var(--signal);color:#fff}
body.present .chrome{display:none}
body.present{overflow:hidden}
#pbar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--signal);
  transform:scaleX(0);transform-origin:left;z-index:60;display:none}
body.present #pbar{display:block}
#pcount{position:fixed;bottom:1.1rem;right:1.4rem;z-index:60;display:none;
  font-size:.6rem;font-weight:700;letter-spacing:.14em;color:var(--smoke)}
body.present #pcount{display:block}

/* ── Slides ─────────────────────────────────────────────────────── */
.deck{padding-top:3rem}
.slide{min-height:100vh;display:flex;align-items:center;position:relative;
  padding:5rem 1.6rem;border-bottom:1px solid var(--hair);overflow:hidden}
.slide .inner{max-width:1240px;margin:0 auto;width:100%;position:relative;z-index:2}
.slide.coal{background:var(--coal)}
body.present .slide{display:none;min-height:100vh}
body.present .slide.active{display:flex}
.bleed{position:absolute;inset:0;z-index:0;overflow:hidden}
.bleed img{width:100%;height:100%;object-fit:cover;opacity:.30}
.bleed::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,var(--ink) 4%,rgba(8,7,10,.76) 50%,rgba(8,7,10,.42))}

.label{font-size:.62rem;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
  color:var(--signal);margin-bottom:1.05rem}
.sub{font-size:clamp(.9rem,1.25vw,1.06rem);line-height:1.62;color:var(--smoke);max-width:62ch;margin-top:1.1rem}
.srcbar{margin-top:1.1rem;padding-top:.7rem;border-top:1px solid var(--hair)}
.src{font-size:.56rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke)}

/* ── Reveal ─────────────────────────────────────────────────────── */
.reveal,.stagger>*{opacity:0;transform:translateY(14px);
  transition:opacity .6s ease,transform .6s ease}
.reveal.in,.stagger.in>*{opacity:1;transform:none}
.stagger.in>*:nth-child(2){transition-delay:.07s}
.stagger.in>*:nth-child(3){transition-delay:.14s}
.stagger.in>*:nth-child(4){transition-delay:.21s}
.stagger.in>*:nth-child(5){transition-delay:.28s}
body.present .reveal,body.present .stagger>*{opacity:1;transform:none;transition:none}

/* ── Big numbers ────────────────────────────────────────────────── */
.bignums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.6rem;margin-top:1.5rem}
.bn-n{font-family:'Oswald',sans-serif;font-weight:600;line-height:.88;
  font-size:clamp(2.1rem,5.4vw,4.1rem)}
.bn-n.hot{color:var(--signal)}
.bn-l{font-size:.68rem;color:var(--smoke);margin-top:.45rem;line-height:1.45;max-width:24ch}

/* ── Two-up ─────────────────────────────────────────────────────── */
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem;margin-top:1.2rem}
@media(max-width:900px){.two{grid-template-columns:1fr;gap:1.5rem}}
.card{border-top:2px solid var(--hair);padding-top:.8rem}
.card.hot{border-top-color:var(--signal)}
.card.gold{border-top-color:var(--gold)}
.card-k{font-size:.55rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--smoke)}
.card-n{font-family:'Oswald',sans-serif;font-weight:600;line-height:.86;margin-top:.4rem;
  font-size:clamp(1.9rem,4.4vw,3.1rem)}
.card.hot .card-n{color:var(--signal)}
.card.gold .card-n{color:var(--gold)}
.card-l{font-size:.62rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--paper);margin-top:.35rem;max-width:26ch;line-height:1.35}
.card-s{font-size:.62rem;color:var(--smoke);line-height:1.6;margin-top:.5rem;max-width:36ch}

/* ── Release timeline (slide 4 / 7) ─────────────────────────────── */
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-top:1.4rem}
@media(max-width:900px){.tl{grid-template-columns:repeat(2,1fr)}}
.tl-c{border-top:2px solid var(--hair);padding-top:.7rem}
.tl-c.hot{border-top-color:var(--signal)}
.tl-c.now{border-top-color:var(--paper)}
.tl-d{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(.9rem,1.75vw,1.25rem);line-height:1.05}
.tl-c.hot .tl-d{color:var(--signal)}
.tl-y{font-size:.5rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);margin-top:.15rem}
.tl-t{font-size:.62rem;font-weight:700;margin-top:.45rem;line-height:1.35}
.tl-s{font-size:.56rem;color:var(--smoke);margin-top:.25rem;line-height:1.5}

/* ── Phases (slide 7) ───────────────────────────────────────────── */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.2rem}
@media(max-width:900px){.ph{grid-template-columns:1fr}}
.ph-c{border-top:2px solid var(--hair);padding-top:.75rem}
.ph-c.hot{border-top-color:var(--signal)}
.ph-k{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1rem,2vw,1.4rem);line-height:1}
.ph-w{font-size:.52rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--signal);margin-top:.28rem}
.ph-l{list-style:none;margin:.55rem 0 0;padding:0}
.ph-l li{font-size:.63rem;color:var(--smoke);line-height:1.7;position:relative;padding-left:.75rem}
.ph-l li::before{content:'';position:absolute;left:0;top:.62em;width:3px;height:3px;
  border-radius:50%;background:var(--smoke);opacity:.6}

/* ── Asset strip ────────────────────────────────────────────────── */
.strip{display:grid;gap:.45rem;margin-top:1.1rem}
.as{position:relative;border-radius:5px;overflow:hidden}
.as img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#17151c}
.as::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(8,7,10,.9),rgba(8,7,10,.1) 56%,transparent 76%)}
.as-m{position:absolute;left:.45rem;right:.45rem;bottom:.35rem;z-index:2}
.as-t{font-size:.55rem;font-weight:700;color:#fff;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.as-v{font-size:.62rem;font-weight:700;color:var(--signal);font-family:'Oswald',sans-serif}

/* ── Ecosystem map (slide 3) ────────────────────────────────────── */
/* Sumerian is the largest bar and is coloured as the signal, because it
   is the asset the slide is arguing FROM, not a problem being flagged. */
.eco{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem;margin-top:1.4rem}
@media(max-width:900px){.eco{grid-template-columns:1fr;gap:1.1rem}}
.eco-c{border-top:1px solid var(--hair);padding-top:.85rem}
.eco-bar{height:6px;background:rgba(242,239,234,.10);border-radius:3px;overflow:hidden;margin-bottom:.8rem}
.eco-bar span{display:block;height:100%;background:var(--smoke);border-radius:3px}
.eco-c.hot .eco-bar span{background:var(--signal)}
.eco-n{font-family:'Oswald',sans-serif;font-weight:600;line-height:.88;
  font-size:clamp(1.8rem,4.2vw,3rem)}
.eco-c.hot .eco-n{color:var(--signal)}
.eco-p{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.1rem;color:var(--smoke);margin-top:.15rem}
.eco-k{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:.5rem}
.eco-s{font-size:.58rem;color:var(--smoke);margin-top:.2rem}

/* ── Roles (slide 5) ────────────────────────────────────────────── */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:1.3rem}
@media(max-width:900px){.roles{grid-template-columns:1fr;gap:1rem}}
.role{border-top:2px solid var(--hair);padding-top:.8rem}
.role.hot{border-top-color:var(--signal)}
.role-k{font-size:.55rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--smoke)}
.role-t{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1.05rem,2.1vw,1.5rem);line-height:1.05;margin-top:.35rem}
.role.hot .role-t{color:var(--signal)}
.role-d{font-size:.63rem;color:var(--smoke);line-height:1.65;margin-top:.5rem}

/* ── Royal Television wall (slide 6) ────────────────────────────── */
.wall{display:grid;grid-template-columns:repeat(8,1fr);gap:.35rem;margin-top:1.1rem}
@media(max-width:900px){.wall{grid-template-columns:repeat(4,1fr)}}
.wall .as img{aspect-ratio:16/9}
.wall .as::after{background:linear-gradient(to top,rgba(8,7,10,.55),transparent 60%)}

/* ── The Station run (slide 6) ──────────────────────────────────── */
/* Mirrors the CHVRCHES station wall: real catalogue interleaved with
   campaign slots, so new material visibly joins the run rather than
   replacing it. Slots are dashed and gold — clearly proposed, not real. */
.stn{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.6rem;margin-top:1.1rem;align-items:start}
@media(max-width:900px){.stn{grid-template-columns:1fr;gap:1.2rem}}
.stn-run{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.sw{position:relative;border-radius:5px;overflow:hidden}
.sw img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#17151c}
.sw::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(8,7,10,.7),transparent 55%)}
.sw-s{position:absolute;left:.3rem;bottom:.25rem;z-index:2;font-size:.48rem;font-weight:700;
  letter-spacing:.1em;color:#fff;opacity:.85}
.sw.slot{aspect-ratio:16/9;border:1.5px dashed var(--gold);border-radius:5px;
  background:rgba(201,162,39,.09);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.15rem;text-align:center;padding:.3rem}
.sw.slot::after{display:none}
.slot-p{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;color:var(--gold);line-height:1}
.slot-t{font-size:.46rem;font-weight:700;color:var(--gold);letter-spacing:.04em;line-height:1.2}
.ref{display:block;border:1px solid var(--hair);border-radius:8px;overflow:hidden;
  text-decoration:none;color:inherit;background:rgba(242,239,234,.03);transition:border-color .18s}
.ref:hover{border-color:var(--gold)}
.ref img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ref-b{padding:.7rem .85rem}
.ref-k{font-size:.5rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.ref-t{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;margin-top:.2rem;text-transform:uppercase}
.ref-d{font-size:.58rem;color:var(--smoke);line-height:1.5;margin-top:.25rem}

/* ── Stations beta note (slide 6) ────────────────────────────────────
   Deliberately ON the slide rather than in the source bar. Stations is
   a new YouTube product in beta — that is not a disclaimer to bury, it
   is part of the ask: we would be pitching YouTube for access, and the
   room needs to know that before anyone plans around it. Sits directly
   under the Metallica card because that is the thing it qualifies.
   Gold, matching the slot styling, so "proposed / not yet real" reads
   consistently across the slide.                                     */
/* The beta note sits UNDER THE RUN, not under the Metallica card. The
   reference card is much taller than the two-row run, so the left column
   had ~296px of dead space; putting the note there costs the slide no
   height at all, where hanging it off the reference card pushed the
   slide past unscaled fit on a 982px laptop. */
.stn-main{min-width:0}
.beta{margin-top:.6rem;border:1px solid rgba(201,162,39,.42);border-radius:8px;
  background:rgba(201,162,39,.07);padding:.6rem .75rem}
.beta-k{display:inline-block;font-size:.46rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--coal);background:var(--gold);
  padding:.16rem .38rem;border-radius:3px;vertical-align:.06rem}
.beta-t{font-size:.58rem;color:var(--smoke);line-height:1.55;margin-top:.4rem}
.beta-t b{color:var(--gold);font-weight:700}
.stn-n{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-top:1.1rem}
@media(max-width:900px){.stn-n{grid-template-columns:repeat(2,1fr)}}
.stn-n b{font-family:'Oswald',sans-serif;font-weight:600;line-height:.9;display:block;
  font-size:clamp(1.5rem,3.4vw,2.4rem)}
.stn-n span{font-size:.6rem;color:var(--smoke);margin-top:.35rem;display:block;line-height:1.45}

/* ── World-building reference (slide 7) ──────────────────────────────
   Three environments as full-bleed image cards, not a table and not a
   chart — the visual has to do the work, because the point is that
   these places FEEL like places. Deliberately reuses the deck's
   existing image-card language rather than introducing a new component.

   The gold modifier marks Hansa's figure as a COUNT rather than a view
   total, so "11 assets" is never mistaken for "11 million".          */
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.3rem}
@media(max-width:900px){.worlds{grid-template-columns:1fr}}
.wld{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--hair);min-width:0}
.wld img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#17151c}
.wld::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(8,7,10,.9),rgba(8,7,10,.2) 58%,transparent)}
.wld-m{position:absolute;left:.85rem;right:.85rem;bottom:.75rem;z-index:2}
.wld-f{font-family:'Oswald',sans-serif;font-weight:600;line-height:.9;
  font-size:clamp(1.15rem,2.5vw,1.85rem);color:var(--signal)}
.wld.g .wld-f{color:var(--gold)}
.wld-n{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(.82rem,1.6vw,1.05rem);line-height:1.05;margin-top:.28rem;color:var(--paper)}
/* Hansa's sub-line is the sentence that carries the whole lesson —
   recurrence, not scale. It was 8.8px, which is source-bar size for a
   line that is doing headline work. There is room on a 252px card. */
.wld-s{font-size:.62rem;color:#B9B3AA;line-height:1.42;margin-top:.22rem}

/* ── Format hierarchy (slide 7) ──────────────────────────────────────
   Replaces a flat seven-tile menu. The whole point of this slide is
   that these formats DO NOT have equal strategic value, so the layout
   must not present them as equals. Three full-width tiers, each with a
   rank numeral and a stated job, then a visibly demoted support strip.

   Tier 1 carries the signal colour and the largest numeral. Tiers 2-3
   step down in accent weight but keep the same type size, because they
   are both real destinations — the step change is between the three
   tiers and the support strip, not within them.                     */
.tiers{display:grid;gap:.6rem;margin-top:1.15rem}
.tier{display:grid;grid-template-columns:auto minmax(0,.95fr) minmax(0,1.35fr);gap:1.1rem;
  align-items:center;padding:.7rem .95rem;border-radius:0 7px 7px 0;
  border-left:3px solid var(--hair);background:rgba(242,239,234,.035)}
.tier.t1{border-left-color:var(--signal);background:rgba(240,83,58,.075)}
.tier.t2{border-left-color:var(--gold);background:rgba(201,162,39,.06)}
.tier.t3{border-left-color:var(--gold);background:rgba(201,162,39,.06)}
.tier-r{font-family:'Oswald',sans-serif;font-weight:600;line-height:.85;
  font-size:clamp(1.5rem,3vw,2.3rem);color:var(--smoke);opacity:.5;min-width:1.1ch}
.tier.t1 .tier-r{color:var(--signal);opacity:1}
.tier.t2 .tier-r,.tier.t3 .tier-r{color:var(--gold);opacity:.9}
.tier-k{font-size:.48rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase;
  color:var(--smoke)}
.tier.t1 .tier-k{color:var(--signal)}
.tier.t2 .tier-k,.tier.t3 .tier-k{color:var(--gold)}
.tier-t{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1rem,2.1vw,1.5rem);line-height:1.04;margin-top:.15rem}
.tier-w{font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);
  margin-top:.28rem}
.tier-d{font-size:.63rem;color:var(--smoke);line-height:1.6}
@media(max-width:900px){.tier{grid-template-columns:auto 1fr}.tier-d{grid-column:1/-1}}
/* The demoted strip. Deliberately hairline-only, no fill, no numeral —
   it must read as a different class of thing, not tier 4 and 5.     */
.support{display:grid;grid-template-columns:repeat(2,1fr);gap:1.3rem;margin-top:.9rem;
  padding-top:.7rem;border-top:1px solid var(--hair)}
/* Support text is deliberately quiet but must still be READABLE from the
   back of a room — the demotion is carried by the hairline rule, the
   absent numeral and the absent fill, not by shrinking type to the
   point of uselessness. 9.3px was too small; these sit just under the
   tier body at 10.08px and the hierarchy still reads. */
.sup-t{font-size:.6rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--smoke)}
.sup-d{font-size:.62rem;color:var(--smoke);opacity:.82;line-height:1.55;margin-top:.24rem}

/* ── Routing flow + format options (slide 7) ────────────────────── */

const slides = () => [

    </div>

    <div class="stn-n stagger">
      <div><b style="color:var(--gold)">${A.rtv.episodes}</b><span>Episodes across ${A.rtv.seasons} seasons</span></div>
      <div><b>${fmt(A.rtv.views)}</b><span>Views on the series so far</span></div>
      <div><b>${A.rtv.s05median.toLocaleString()}</b><span>Median episode, most recent season</span></div>
      <div><b>${esc(A.rtv.last)}</b><span>The last episode</span></div>
    </div>

    <h3 class="display mid reveal" style="margin-top:1rem;max-width:52ch;font-size:clamp(1.15rem,2.4vw,1.85rem)">Don't
      restart a weekly series. <span style="color:var(--gold)">Make four episodes matter.</span></h3>
    <div class="srcbar reveal"><span class="src">${A.rtv.episodes} episodes excludes
      ${A.rtv.promoClips} short promo clips · median episode figure is Season 05 only, median
      length ${A.rtv.s05dur} · Metallica referenced as a format example only, with no comparison
      of scale drawn</span></div>
  </div>
</section>`,

/* 07 ── WORLD BUILDING · THE YUNGBLUD REFERENCE ────────────────────
   Sits between Royal Television and the format hierarchy on purpose:
   the audience has just seen the asset Palaye already own, and is
   about to be told what to programme. This slide is the bridge — it
   shows what the space between hero releases can BE.

   Metallica (slide 06) shows a programmed destination. This shows
   world building. Two references, two different lessons, and the deck
   needs both. Neither is a benchmark.

   The whole slide is one idea: these are not extra assets, they are
   the same songs given somewhere else to live. Do not add ratios,
   medians or a comparison to Palaye's numbers — the moment a number
   from a 3.87m-subscriber channel is set against a 272k one, the slide
   stops being a creative reference and becomes a false promise.

   The closing line hands off deliberately: "Another way in." here,
   "Multiple ways in." on the next slide.                            */
`<section class="slide coal" data-t="World building">
  <div class="inner">
    <div class="label reveal">A contemporary reference</div>
    <h2 class="display big reveal" style="max-width:21ch">Don't just make another asset.<br>
      <span style="color:var(--signal)">Make another place<br>the record can live.</span></h2>
    <div class="worlds stagger">
      ${A.yb.envs.map(e=>`
        <div class="wld${e.gold?' g':''}">
          <img src="${thumb(e.id,'maxresdefault')}" alt="${esc(e.name)}"
            onerror="this.src='${thumb(e.id)}'">
          <div class="wld-m">
            <div class="wld-f">${esc(e.fig)}</div>
            <div class="wld-n">${esc(e.name)}</div>
            <div class="wld-s">${esc(e.sub)}</div>
          </div>
        </div>`).join('')}
    </div>
    <h3 class="display mid reveal" style="margin-top:1.2rem;max-width:40ch;font-size:clamp(1.15rem,2.4vw,1.85rem)">The
      same songs. <span style="color:var(--signal)">Another way in.</span></h3>
    <div class="srcbar reveal"><span class="src">YUNGBLUD · public YouTube data · current views ·
      a much larger channel than yours · a reference for how the space between releases is used,
      not a performance benchmark</span></div>
  </div>
</section>`,

/* 08 ── THE FORMAT HIERARCHY ───────────────────────────────────────
   The biggest strategic change in this revision. The previous version
   showed seven formats as equal tiles tagged "Have it / Opportunity",
   which is a CONTENT MENU. The research says these formats have very
   different value, so the slide now has to be a PROGRAMMING SYSTEM:
   three formats, three jobs, and everything else demoted below a rule.

   Live is tier 3 by sequence, not by importance — it is the newest and
   strongest recommendation in the deck. Palaye's four 2020 live
   performances median 133,828, six times Royal Television's current
   season, despite being five years older. Nothing live since 2021.

   The peer evidence stays UNDERNEATH. No YUNGBLUD, no benchmark table,
   no ratios on this slide. The research earned the conclusion; the
   artist-facing surface states it.

   Lyric and visualiser are deliberately below the rule and described
   as response-led. They are not "opportunities" to be delivered — the
   evidence says they are the weakest default commitments here.     */
`<section class="slide" data-t="Every video needs a next">
  <div class="inner">
    <div class="label reveal">One world. Multiple ways in.</div>
    <h2 class="display big reveal" style="max-width:20ch">Three formats.<br>
      <span style="color:var(--signal)">Three different jobs.</span></h2>
    <div class="tiers stagger">
      ${[['t1','1','Hero','Official music video','Sumerian',
          'The release itself. This is where the reach is, and it stays there.'],
         ['t2','2','Story','Royal Television','Your channel',
          'The narrative around the record. Four episodes, tied to the four moments.'],
         ['t3','3','Performance','Live, acoustic or session','Your channel',
          'The second music moment — so there is somewhere to go between the videos.']]
        .map(([c,r,k,t,w,d])=>`
        <div class="tier ${c}">
          <div class="tier-r">${r}</div>
          <div><div class="tier-k">${k}</div><div class="tier-t">${t}</div>
            <div class="tier-w">${w}</div></div>
          <p class="tier-d">${d}</p>
        </div>`).join('')}
    </div>
    <div class="support reveal">
      <div><div class="sup-t">Shorts · support</div>
        <p class="sup-d">Cut from the three above, not commissioned on their own. They point at
          the work — they aren't the work.</p></div>
      <div><div class="sup-t">Lyric &amp; visualiser · response-led</div>
        <p class="sup-d">Only when a particular song is already moving. Not automatic campaign
          deliverables.</p></div>
    </div>
    <div class="srcbar reveal"><span class="src">Performance earns its place on your own evidence —
      the ${A.live.n} live and acoustic videos from 2020 median
      ${A.live.median.toLocaleString()} views, the strongest non-music-video assets the channel has
      ever carried · nothing live since ${A.live.lastPosted}</span></div>
  </div>
</section>`,

/* 08 ── THE CAMPAIGN ───────────────────────────────────────────────
   The supplied dates, with Royal Television recurring in the gaps.
   Kept light — a shape to agree, not a content calendar.          */
`<section class="slide coal" data-t="Four moments">
  <div class="inner">
    <div class="label reveal">The campaign</div>
    <h2 class="display big reveal" style="max-width:20ch">Four moments.<br>
      <span style="color:var(--signal)">One connected campaign.</span></h2>
    <div class="tl stagger">
      ${A.plan.map(p=>`
        <div class="tl-c${p.hot?' hot':''}">
          <div class="tl-d">${esc(p.d)}</div>
          <div class="tl-y">${p.y}</div>
          <div class="tl-t">${esc(p.t)}</div>
          <div class="tl-s">${esc(p.s)}</div>
        </div>`).join('')}
    </div>
    <div class="band reveal">
      <span>Build</span><i>→</i><span class="hot">Hero</span><i>→</i><span>Extend</span>
      <i>→</i><span>Connect</span><i>→</i><span>Next</span>
    </div>
    <p class="sub reveal">The videos go out where the reach is. Between them: an episode, and a
      performance. The gaps are three to nine weeks &mdash; and the run into January is the long
      one. <strong style="color:var(--paper)">That is the part worth planning.</strong></p>
  </div>
</section>`,

/* 09 ── CLOSE ──────────────────────────────────────────────────── */
`<section class="slide" data-t="Close">
  <div class="bleed"><img src="${thumb(A.morningLight.id,'maxresdefault')}" alt=""></div>
  <div class="inner">
    <div class="label reveal">Where this goes</div>
    <h2 class="display big reveal" style="max-width:20ch">Keep the reach.<br>
      <span style="color:var(--signal)">Build the world around it.</span></h2>
    <p class="sub reveal" style="max-width:50ch">Four videos, sixteen weeks, and 201 million views
      already out there across three destinations. Keep the reach where it is. Give the channel
      a job.</p>
  </div>
</section>`,
];

/* ═══════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════════ */
document.getElementById('deck').innerHTML = slides().join('');

const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting) e.target.classList.add('in');
}),{threshold:.14});
document.querySelectorAll('.reveal,.stagger').forEach(el=>io.observe(el));

/* ── Presentation mode ─────────────────────────────────────────── */
let cur = 0;
const allSlides = () => [...document.querySelectorAll('.slide')];
function startPresent(){
  document.body.classList.add('present');
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  showSlide(0);
}
function exitPresent(){
  document.body.classList.remove('present');
  allSlides().forEach(s=>s.classList.remove('active'));
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
function showSlide(i){
  const S = allSlides();
  cur = Math.max(0, Math.min(S.length-1, i));
  S.forEach((s,n)=>s.classList.toggle('active', n===cur));
  const pb=document.getElementById('pbar');
  if(pb) pb.style.transform='scaleX('+((cur+1)/S.length)+')';
  const pc=document.getElementById('pcount');
  if(pc) pc.textContent=(cur+1)+' / '+S.length;
  fitActive();
  allSlides()[cur].querySelectorAll('img').forEach(img=>{
    if(!img.complete) img.addEventListener('load', fitActive, { once:true });
  });
}

/* Fit the active slide to whatever screen it lands on. Decks get presented
   on laptops, not on the 1080p frame they were designed against — a 14"
   MacBook is 982px tall, and without this the tallest slides lose their
   headline off the top. The whole slide scales as one object, so nothing
   reflows and nothing rewraps. A slide that already fits is untouched. */
function fitActive(){
  if(!document.body.classList.contains('present')) return;
  const el = allSlides()[cur]; if(!el) return;
  const inner = el.querySelector('.inner'); if(!inner) return;
  inner.style.transform = '';
  const cs = getComputedStyle(el);
  const avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const need = inner.scrollHeight;
  if(avail > 0 && need > avail){
    const k = Math.max(0.72, avail / need);
    inner.style.transformOrigin = 'center center';
    inner.style.transform = 'scale(' + k.toFixed(4) + ')';
  }
}
let fitTimer;
window.addEventListener('resize', ()=>{ clearTimeout(fitTimer); fitTimer=setTimeout(fitActive,120); });
document.addEventListener('fullscreenchange', ()=> setTimeout(fitActive,260));

document.addEventListener('keydown', e=>{
  if(!document.body.classList.contains('present')) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();showSlide(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();showSlide(cur-1);}
  else if(e.key==='Escape'){exitPresent();}
});
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('present')) exitPresent();
});
</script>
</body>
