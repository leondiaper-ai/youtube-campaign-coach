<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palaye Royale × YouTube — The Album Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   PALAYE ROYALE × YOUTUBE — THE ALBUM CAMPAIGN

   Figures from a YouTube Data API v3 pull taken 2 September 2026 across
   three channels: @PalayeRoyale (340 of 340 uploads), @SumerianRecords
   (3,664 uploads, of which 114 are Palaye Royale), and the auto-generated
   Palaye Royale - Topic channel (154 tracks). No Studio or Analytics data.

   AUDIENCE: artist and management. Everything is framed as what is
   available to build on. Sumerian is treated throughout as a reach
   partner that has built something valuable, never as a problem.

   ── THE CORRECTION THAT PRODUCED THIS VERSION ──────────────────────
   An earlier build argued that Palaye's recent music videos "didn't land
   on the artist channel" and that the four upcoming videos should be
   placed there. That was WRONG and is now removed entirely.

   The videos exist. Feel Something, Great. (717,799) and Sad Generation
   (529,008) are official videos on Sumerian, and both outperformed their
   Topic audio pages. The old deck's 990,211 figure counted only the audio
   surfaces and understated the true response by 56%.

   Mapped ecosystem: Sumerian 142,460,149 (64.1%) · artist channel
   58,617,481 (26.4%) · Topic 21,082,685 (9.5%) = 222,160,315. Verified
   ZERO shared video IDs across the three, so the sum is of distinct
   uploads — but it is always described as OBSERVED views across THREE
   MAPPED destinations, never as total Palaye YouTube views. Roughly 20.9m
   of artist-channel lifetime sits in videos no longer in the playlist,
   and collaborator surfaces are unmapped.

   NEVER claim: that views were lost or diverted to the label; that the
   videos were uploaded in the wrong place; that the artist channel would
   have done better; that the hybrid model will increase views; that
   Royal Television converts subscribers; that Shorts route to long-form.
   None of that is supported by public data.

   Royal Television uses the CURRENT season (05 median 12,682 against a
   median recent Short of 3,394, ~3.7x). The all-time median of 31,888 and
   the "nine times a Short" line are gone — they were propped up by the
   2018 seasons and flattered a declining franchise.
   ═══════════════════════════════════════════════════════════════════ */

:root{
  --ink:#08070A;           /* near-black ground */
  --coal:#0F0D13;
  --paper:#F2EFEA;         /* bone */
  --bone:#D8D2C9;
  --smoke:#8B8590;
  --signal:#C4162E;        /* oxblood — the band's own register */
  --gold:#C9A227;          /* used once, on the owned-asset slide */
  --hair:rgba(242,239,234,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.display{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:-.01em;line-height:.94;margin:0}
.display.big{font-size:clamp(2.3rem,6.4vw,5.3rem)}
.display.mid{font-size:clamp(1.5rem,3.5vw,2.9rem)}

/* ── Chrome ─────────────────────────────────────────────────────── */
.chrome{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;
  align-items:center;justify-content:space-between;padding:.85rem 1.6rem;
  background:rgba(8,7,10,.82);border-bottom:1px solid var(--hair)}
.chrome-t{font-size:.6rem;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--smoke)}
.btn{font:inherit;font-size:.62rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:.5rem .9rem;border-radius:99px;border:1px solid var(--hair);
  background:transparent;color:var(--paper);cursor:pointer}
.btn.on{background:var(--signal);border-color:var(--signal);color:#fff}
body.present .chrome{display:none}
body.present{overflow:hidden}
#pbar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--signal);
  transform:scaleX(0);transform-origin:left;z-index:60;display:none}
body.present #pbar{display:block}
#pcount{position:fixed;bottom:1.1rem;right:1.4rem;z-index:60;display:none;
  font-size:.6rem;font-weight:700;letter-spacing:.14em;color:var(--smoke)}
body.present #pcount{display:block}

/* ── Slides ─────────────────────────────────────────────────────── */
.deck{padding-top:3rem}
.slide{min-height:100vh;display:flex;align-items:center;position:relative;
  padding:5rem 1.6rem;border-bottom:1px solid var(--hair);overflow:hidden}
.slide .inner{max-width:1240px;margin:0 auto;width:100%;position:relative;z-index:2}
.slide.coal{background:var(--coal)}
body.present .slide{display:none;min-height:100vh}
body.present .slide.active{display:flex}
.bleed{position:absolute;inset:0;z-index:0;overflow:hidden}
.bleed img{width:100%;height:100%;object-fit:cover;opacity:.30}
.bleed::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,var(--ink) 4%,rgba(8,7,10,.76) 50%,rgba(8,7,10,.42))}

.label{font-size:.62rem;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
  color:var(--signal);margin-bottom:1.05rem}
.sub{font-size:clamp(.9rem,1.25vw,1.06rem);line-height:1.62;color:var(--smoke);max-width:62ch;margin-top:1.1rem}
.srcbar{margin-top:1.1rem;padding-top:.7rem;border-top:1px solid var(--hair)}
.src{font-size:.56rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke)}

/* ── Reveal ─────────────────────────────────────────────────────── */
.reveal,.stagger>*{opacity:0;transform:translateY(14px);
  transition:opacity .6s ease,transform .6s ease}
.reveal.in,.stagger.in>*{opacity:1;transform:none}
.stagger.in>*:nth-child(2){transition-delay:.07s}
.stagger.in>*:nth-child(3){transition-delay:.14s}
.stagger.in>*:nth-child(4){transition-delay:.21s}
.stagger.in>*:nth-child(5){transition-delay:.28s}
body.present .reveal,body.present .stagger>*{opacity:1;transform:none;transition:none}

/* ── Big numbers ────────────────────────────────────────────────── */
.bignums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.6rem;margin-top:1.5rem}
.bn-n{font-family:'Oswald',sans-serif;font-weight:600;line-height:.88;
  font-size:clamp(2.1rem,5.4vw,4.1rem)}
.bn-n.hot{color:var(--signal)}
.bn-l{font-size:.68rem;color:var(--smoke);margin-top:.45rem;line-height:1.45;max-width:24ch}

/* ── Two-up ─────────────────────────────────────────────────────── */
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem;margin-top:1.2rem}
@media(max-width:900px){.two{grid-template-columns:1fr;gap:1.5rem}}
.card{border-top:2px solid var(--hair);padding-top:.8rem}
.card.hot{border-top-color:var(--signal)}
.card.gold{border-top-color:var(--gold)}
.card-k{font-size:.55rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--smoke)}
.card-n{font-family:'Oswald',sans-serif;font-weight:600;line-height:.86;margin-top:.4rem;
  font-size:clamp(1.9rem,4.4vw,3.1rem)}
.card.hot .card-n{color:var(--signal)}
.card.gold .card-n{color:var(--gold)}
.card-l{font-size:.62rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--paper);margin-top:.35rem;max-width:26ch;line-height:1.35}
.card-s{font-size:.62rem;color:var(--smoke);line-height:1.6;margin-top:.5rem;max-width:36ch}

/* ── Release timeline (slide 4 / 7) ─────────────────────────────── */
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-top:1.4rem}
@media(max-width:900px){.tl{grid-template-columns:repeat(2,1fr)}}
.tl-c{border-top:2px solid var(--hair);padding-top:.7rem}
.tl-c.hot{border-top-color:var(--signal)}
.tl-c.now{border-top-color:var(--paper)}
.tl-d{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(.9rem,1.75vw,1.25rem);line-height:1.05}
.tl-c.hot .tl-d{color:var(--signal)}
.tl-y{font-size:.5rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);margin-top:.15rem}
.tl-t{font-size:.62rem;font-weight:700;margin-top:.45rem;line-height:1.35}
.tl-s{font-size:.56rem;color:var(--smoke);margin-top:.25rem;line-height:1.5}

/* ── Phases (slide 7) ───────────────────────────────────────────── */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.2rem}
@media(max-width:900px){.ph{grid-template-columns:1fr}}
.ph-c{border-top:2px solid var(--hair);padding-top:.75rem}
.ph-c.hot{border-top-color:var(--signal)}
.ph-k{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1rem,2vw,1.4rem);line-height:1}
.ph-w{font-size:.52rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--signal);margin-top:.28rem}
.ph-l{list-style:none;margin:.55rem 0 0;padding:0}
.ph-l li{font-size:.63rem;color:var(--smoke);line-height:1.7;position:relative;padding-left:.75rem}
.ph-l li::before{content:'';position:absolute;left:0;top:.62em;width:3px;height:3px;
  border-radius:50%;background:var(--smoke);opacity:.6}

/* ── Asset strip ────────────────────────────────────────────────── */
.strip{display:grid;gap:.45rem;margin-top:1.1rem}
.as{position:relative;border-radius:5px;overflow:hidden}
.as img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#17151c}
.as::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(8,7,10,.9),rgba(8,7,10,.1) 56%,transparent 76%)}
.as-m{position:absolute;left:.45rem;right:.45rem;bottom:.35rem;z-index:2}
.as-t{font-size:.55rem;font-weight:700;color:#fff;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.as-v{font-size:.62rem;font-weight:700;color:var(--signal);font-family:'Oswald',sans-serif}

/* ── Ecosystem map (slide 3) ────────────────────────────────────── */
/* Sumerian is the largest bar and is coloured as the signal, because it
   is the asset the slide is arguing FROM, not a problem being flagged. */
.eco{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem;margin-top:1.4rem}
@media(max-width:900px){.eco{grid-template-columns:1fr;gap:1.1rem}}
.eco-c{border-top:1px solid var(--hair);padding-top:.85rem}
.eco-bar{height:6px;background:rgba(242,239,234,.10);border-radius:3px;overflow:hidden;margin-bottom:.8rem}
.eco-bar span{display:block;height:100%;background:var(--smoke);border-radius:3px}
.eco-c.hot .eco-bar span{background:var(--signal)}
.eco-n{font-family:'Oswald',sans-serif;font-weight:600;line-height:.88;
  font-size:clamp(1.8rem,4.2vw,3rem)}
.eco-c.hot .eco-n{color:var(--signal)}
.eco-p{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.1rem;color:var(--smoke);margin-top:.15rem}
.eco-k{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:.5rem}
.eco-s{font-size:.58rem;color:var(--smoke);margin-top:.2rem}

/* ── Roles (slide 5) ────────────────────────────────────────────── */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:1.3rem}
@media(max-width:900px){.roles{grid-template-columns:1fr;gap:1rem}}
.role{border-top:2px solid var(--hair);padding-top:.8rem}
.role.hot{border-top-color:var(--signal)}
.role-k{font-size:.55rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--smoke)}
.role-t{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1.05rem,2.1vw,1.5rem);line-height:1.05;margin-top:.35rem}
.role.hot .role-t{color:var(--signal)}
.role-d{font-size:.63rem;color:var(--smoke);line-height:1.65;margin-top:.5rem}

/* ── Royal Television wall (slide 6) ────────────────────────────── */
.wall{display:grid;grid-template-columns:repeat(8,1fr);gap:.35rem;margin-top:1.1rem}
@media(max-width:900px){.wall{grid-template-columns:repeat(4,1fr)}}
.wall .as img{aspect-ratio:16/9}
.wall .as::after{background:linear-gradient(to top,rgba(8,7,10,.55),transparent 60%)}

/* ── The Station run (slide 6) ──────────────────────────────────── */
/* Mirrors the CHVRCHES station wall: real catalogue interleaved with
   campaign slots, so new material visibly joins the run rather than
   replacing it. Slots are dashed and gold — clearly proposed, not real. */
.stn{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.6rem;margin-top:1.1rem;align-items:start}
@media(max-width:900px){.stn{grid-template-columns:1fr;gap:1.2rem}}
.stn-run{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.sw{position:relative;border-radius:5px;overflow:hidden}
.sw img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#17151c}
.sw::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(8,7,10,.7),transparent 55%)}
.sw-s{position:absolute;left:.3rem;bottom:.25rem;z-index:2;font-size:.48rem;font-weight:700;
  letter-spacing:.1em;color:#fff;opacity:.85}
.sw.slot{aspect-ratio:16/9;border:1.5px dashed var(--gold);border-radius:5px;
  background:rgba(201,162,39,.09);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.15rem;text-align:center;padding:.3rem}
.sw.slot::after{display:none}
.slot-p{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;color:var(--gold);line-height:1}
.slot-t{font-size:.46rem;font-weight:700;color:var(--gold);letter-spacing:.04em;line-height:1.2}
.ref{display:block;border:1px solid var(--hair);border-radius:8px;overflow:hidden;
  text-decoration:none;color:inherit;background:rgba(242,239,234,.03);transition:border-color .18s}
.ref:hover{border-color:var(--gold)}
.ref img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ref-b{padding:.7rem .85rem}
.ref-k{font-size:.5rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.ref-t{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;margin-top:.2rem;text-transform:uppercase}
.ref-d{font-size:.58rem;color:var(--smoke);line-height:1.5;margin-top:.25rem}
.stn-n{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-top:1.1rem}
@media(max-width:900px){.stn-n{grid-template-columns:repeat(2,1fr)}}
.stn-n b{font-family:'Oswald',sans-serif;font-weight:600;line-height:.9;display:block;
  font-size:clamp(1.5rem,3.4vw,2.4rem)}
.stn-n span{font-size:.6rem;color:var(--smoke);margin-top:.35rem;display:block;line-height:1.45}

/* ── Routing flow + format options (slide 7) ────────────────────── */
.flow{display:flex;align-items:stretch;gap:.9rem;margin-top:1.3rem;flex-wrap:wrap}
.flow-c{border-top:2px solid var(--hair);padding-top:.7rem;min-width:150px;flex:1}
.flow-c.hot{border-top-color:var(--signal)}
.flow-k{font-size:.52rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke)}
.flow-t{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1rem,2vw,1.35rem);line-height:1.05;margin-top:.3rem}
.flow-c.hot .flow-t{color:var(--signal)}
.flow-a{color:var(--smoke);align-self:center;font-size:1.1rem;opacity:.5}
.opts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.2rem}
.opt{font-size:.6rem;font-weight:700;letter-spacing:.04em;padding:.4rem .7rem;
  border:1px solid var(--hair);border-radius:99px;display:flex;gap:.5rem;align-items:center}
.opt span{font-size:.48rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke)}
.opt.new{border-color:rgba(201,162,39,.5)}
.opt.new span{color:var(--gold)}

/* ── Campaign band (slide 8) ────────────────────────────────────── */
.band{display:flex;flex-wrap:wrap;gap:.55rem .8rem;align-items:center;margin-top:1.2rem;
  padding-top:.85rem;border-top:1px solid var(--hair)}
.band span{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(.85rem,1.6vw,1.15rem);line-height:1}
.band span.hot{color:var(--signal)}
.band i{font-style:normal;color:var(--smoke);opacity:.45}

/* ── Decisions (slide 8) ────────────────────────────────────────── */
.dec{display:grid;grid-template-columns:auto 1fr;gap:1rem;padding:.85rem 0;
  border-bottom:1px solid var(--hair);align-items:start}
.dec-n{font-family:'Oswald',sans-serif;font-weight:600;color:var(--signal);
  font-size:1.5rem;line-height:1}
.dec-t{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1rem,2vw,1.35rem);line-height:1.05}
.dec-a{font-size:.66rem;color:var(--smoke);line-height:1.65;margin-top:.3rem;max-width:62ch}
</style>
</head>
<body>
<div id="pbar"></div><div id="pcount"></div>
<div class="chrome">
  <span class="chrome-t">Palaye Royale × YouTube · Album campaign</span>
  <button class="btn on" id="presentBtn" onclick="startPresent()">Present</button>
</div>
<div class="deck" id="deck"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   DATA — every figure recomputed 2 Sep 2026 from the complete
   @PalayeRoyale uploads playlist (340 of 340) and the auto-generated
   "Palaye Royale - Topic" channel. Nothing is carried forward.
   ═══════════════════════════════════════════════════════════════════ */
const A = {
  /* ── The three mapped destinations. Zero shared video IDs between them,
     verified, so these are distinct uploads. Always described as OBSERVED
     views across MAPPED destinations. ─────────────────────────────── */
  eco:{
    total:222160315,
    sumerian:{ name:'Sumerian', videos:114, views:142460149, pct:64,
      subs:2980000, lifetime:2809335853, musicVideos:32, mvViews:115574799 },
    artist:{ name:'Palaye Royale', videos:340, views:58617481, pct:26, subs:272000 },
    topic:{ name:'Palaye Royale audio', videos:154, views:21082685, pct:10 },
  },

  /* Sumerian's biggest Palaye music videos — the reach that already exists. */
  sumerianMV:[
    { id:'nzM134EhSFQ', t:'Mr. Doctor Man',        v:19264331, y:'2016' },
    { id:'f5Nc4kiBaIs', t:'Lonely',                v:11303052, y:'2020' },
    { id:'CrUM4tVpmRc', t:'Broken',                v:7765122,  y:'2022' },
    { id:'0WzprXZGoLs', t:'Punching Bag',          v:6248015,  y:'2021' },
    { id:'qePhiiz7dtc', t:'No Love In LA',         v:5749157,  y:'2021' },
    { id:'4AnmemzByVY', t:'Dying In A Hot Tub',    v:5525435,  y:'2019' },
  ],

  /* Current artist-channel state. Stated as evidence, never as an insult. */
  channelNow:{ dormantDays:81, lastUpload:'13 June 2026',
    bio:'Our brand new album, Death or Glory out now.',
    videosTabTop:'Royal Television, Season 05', videosTabAge:'a year ago' },

  /* ── ROYAL TELEVISION AS THE STATION ──────────────────────────────
     Same framing as the CHVRCHES and Amyl decks: an always-on programmed
     run built from the artist's own catalogue, with Metallica TV as the
     live platform reference (verified via oEmbed, 2 Sep 2026 — title
     "Metallica TV", channel Metallica). We reference the format only and
     never reproduce Metallica branding.

     The difference here, and the reason this slide is stronger than the
     equivalent in the other decks: CHVRCHES and Amyl would be starting a
     programmed series from nothing. Palaye Royale already run one. Royal
     Television is 84 episodes across five seasons, so the ask is to
     restart and programme it around the album rather than invent it.

     CURRENT-season figures only. Season 05 medians 12,682 against a
     median recent Short of 3,394 (~3.7x). The all-time median of 31,888
     is not used — the 2018 seasons have had eight years to accumulate
     and would flatter a series that has cooled.

     NOTE: YouTube Stations is an emerging / beta product. Eligibility and
     access would need confirming with YouTube. The slide says so. */
  rtv:{ episodes:84, seasons:5, views:3424254,
    s05:18, s05median:12682, medianShort:3394, multiple:'3.7', last:'July 2025',
    station:{ id:'1fz60gNnSdU', label:'Metallica TV', channel:'Metallica' },
    /* The run: real episodes spanning four seasons, with campaign slots
       dropped in — new material joins the run rather than replacing it. */
    run:[
      { id:'vV38F4W8Phc', s:'S01' },
      { id:'Q27iB0fzleo', s:'S01' },
      { slot:true, t:'Lost In Translation' },
      { id:'6wS-xFtJrnE', s:'S03' },
      { id:'7Pg1xKEbzDA', s:'S04' },
      { slot:true, t:'Live / tour' },
      { id:'Wl7Mtp7XZrc', s:'S05' },
      { id:'NHW5Ds_EZJc', s:'S05' },
      { slot:true, t:'Album episode' },
      { id:'ENBRRpyozn0', s:'S04' },
    ] },

  /* Programming reference only. No scale or performance comparison. */
  metallica:{ activeMonths:'24 / 24', live:111, making:34, bts:41 },

  plan:[
    { d:'2 Oct',  y:'2026', t:'Lost In Translation', s:'Music video · album announce', hot:true },
    { d:'27 Oct', y:'2026', t:'Single two',          s:'Music video', hot:true },
    { d:'19 Nov', y:'2026', t:'Single three',        s:'Music video', hot:true },
    { d:'22 Jan', y:'2027', t:'The album',           s:'Focus track · music video', hot:true },

document.getElementById('deck').innerHTML = slides().join('');

const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting) e.target.classList.add('in');
}),{threshold:.14});
document.querySelectorAll('.reveal,.stagger').forEach(el=>io.observe(el));

/* ── Presentation mode ─────────────────────────────────────────── */
let cur = 0;
const allSlides = () => [...document.querySelectorAll('.slide')];
function startPresent(){
  document.body.classList.add('present');
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  showSlide(0);
}
function exitPresent(){
  document.body.classList.remove('present');
  allSlides().forEach(s=>s.classList.remove('active'));
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
function showSlide(i){
  const S = allSlides();
  cur = Math.max(0, Math.min(S.length-1, i));
  S.forEach((s,n)=>s.classList.toggle('active', n===cur));
  const pb=document.getElementById('pbar');
  if(pb) pb.style.transform='scaleX('+((cur+1)/S.length)+')';
  const pc=document.getElementById('pcount');
  if(pc) pc.textContent=(cur+1)+' / '+S.length;
  fitActive();
  allSlides()[cur].querySelectorAll('img').forEach(img=>{
    if(!img.complete) img.addEventListener('load', fitActive, { once:true });
  });
}

/* Fit the active slide to whatever screen it lands on. Decks get presented
   on laptops, not on the 1080p frame they were designed against — a 14"
   MacBook is 982px tall, and without this the tallest slides lose their
   headline off the top. The whole slide scales as one object, so nothing
   reflows and nothing rewraps. A slide that already fits is untouched. */
function fitActive(){
  if(!document.body.classList.contains('present')) return;
  const el = allSlides()[cur]; if(!el) return;
  const inner = el.querySelector('.inner'); if(!inner) return;
  inner.style.transform = '';
  const cs = getComputedStyle(el);
  const avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const need = inner.scrollHeight;
  if(avail > 0 && need > avail){
    const k = Math.max(0.72, avail / need);
    inner.style.transformOrigin = 'center center';
    inner.style.transform = 'scale(' + k.toFixed(4) + ')';
  }
}
let fitTimer;
window.addEventListener('resize', ()=>{ clearTimeout(fitTimer); fitTimer=setTimeout(fitActive,120); });
document.addEventListener('fullscreenchange', ()=> setTimeout(fitActive,260));

document.addEventListener('keydown', e=>{
  if(!document.body.classList.contains('present')) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();showSlide(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();showSlide(cur-1);}
  else if(e.key==='Escape'){exitPresent();}
});
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('present')) exitPresent();
});
