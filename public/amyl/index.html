<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amyl and The Sniffers × YouTube — Virgin Music Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   DESIGN SYSTEM
   Inherits the VMG × YouTube deck tokens, re-weighted for Amyl:
   harder contrast, condensed display face, accent used sparingly.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --ink:#0B0B0B;          /* foundation black */
  --paper:#F4F1EA;        /* off-white */
  --cream:#EAE5DA;
  --signal:#FF3B14;       /* single strong accent */
  --yt:#FF0000;           /* YouTube red — functional only */
  --mint:#1FBE7A;
  --electric:#2C25FF;
  --sun:#FFD24C;
  --smoke:#8A847A;
  --bone:#E2DCD1;
  --warm:#4A4640;
  --hair:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--ink);color:var(--paper);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.display{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.005em;line-height:.92;text-transform:uppercase}

/* ── Slides ─────────────────────────────────────────────────────── */
.slide{
  position:relative;min-height:100vh;display:flex;flex-direction:column;
  justify-content:center;padding:clamp(2rem,6vw,5rem);
  border-bottom:1px solid rgba(255,255,255,.07);overflow:hidden;
}
.slide.light{background:var(--paper);color:var(--ink);border-bottom-color:var(--bone)}
.slide.cream{background:var(--cream);color:var(--ink);border-bottom-color:#d8d2c6}
.inner{width:100%;max-width:1240px;margin:0 auto;position:relative;z-index:2}

.label{font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--signal);margin-bottom:1.25rem}
.slide.light .label,.slide.cream .label{color:var(--signal)}
.kicker{font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--smoke)}

h1.hero{font-size:clamp(2.3rem,7.4vw,6.2rem)}
h2.big{font-size:clamp(2.4rem,7vw,5.5rem)}
h3.mid{font-size:clamp(1.7rem,3.6vw,2.9rem)}
.sub{font-size:clamp(1rem,1.5vw,1.25rem);color:var(--smoke);max-width:760px;margin-top:1.5rem;line-height:1.55}
.slide.light .sub,.slide.cream .sub{color:var(--warm)}
.slide.light .cap,.slide.cream .cap,
.slide.light .stat .cap,.slide.cream .stat .cap,
.slide.light .stat .sub2,.slide.cream .stat .sub2,
.slide.light .tsub,.slide.cream .tsub,
.slide.light .flow-note,.slide.cream .flow-note,
.slide.light .kicker,.slide.cream .kicker{color:var(--warm)}
.slide.light .stat .sub2,.slide.cream .stat .sub2{opacity:1}
.statement{font-size:clamp(1.3rem,2.4vw,2rem);font-weight:800;letter-spacing:-.02em;line-height:1.25;max-width:900px}

/* ── Reveal ─────────────────────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.reveal.visible{opacity:1;transform:none}
.stagger>*{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.stagger>*.visible{opacity:1;transform:none}

/* ── Stat blocks ────────────────────────────────────────────────── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(1rem,3vw,3rem);margin-top:2.5rem}
.stat .num{font-family:'Anton',sans-serif;font-size:clamp(2.6rem,6vw,5rem);line-height:.9;letter-spacing:0}
.stat .cap{font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke);margin-top:.7rem}
.stat .sub2{font-size:.7rem;color:var(--smoke);margin-top:.35rem;opacity:.75}

/* ── Thumbnails ─────────────────────────────────────────────────── */
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-top:2.5rem}
.tcard{display:block;text-decoration:none;color:inherit;border-radius:10px;overflow:hidden;
  background:rgba(255,255,255,.04);border:1px solid var(--hair);transition:transform .3s ease}
.slide.light .tcard,.slide.cream .tcard{background:#fff;border-color:var(--bone)}
.tcard:hover{transform:translateY(-4px)}
.tcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.tmeta{padding:.75rem .85rem}
.ttitle{font-size:.74rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tviews{font-family:'Anton',sans-serif;font-size:1.15rem;margin-top:.4rem;color:var(--signal)}
.tsub{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);margin-top:.2rem}

/* ── Bars ───────────────────────────────────────────────────────── */
.bar-row{margin-bottom:1.1rem}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem}
.bar-name{font-size:.8rem;font-weight:600}
.bar-val{font-family:'Anton',sans-serif;font-size:1.1rem}
.bar-track{height:26px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.slide.light .bar-track,.slide.cream .bar-track{background:rgba(0,0,0,.07)}
.bar-fill{height:100%;width:0;border-radius:5px;transition:width 1.1s cubic-bezier(.25,.46,.45,.94)}

/* ── Timeline (slide 7) ─────────────────────────────────────────── */
.tl{display:flex;align-items:flex-end;gap:5px;margin-top:2.5rem;flex-wrap:nowrap;overflow-x:auto;padding-bottom:1rem}
.tl-item{flex:0 0 auto;text-align:center;min-width:46px}
.tl-bar{width:100%;border-radius:3px 3px 0 0;background:var(--smoke);opacity:.55}
.tl-item.hero .tl-bar{background:var(--signal);opacity:1}
.tl-item.album .tl-bar{background:var(--sun);opacity:1}
.tl-item.next .tl-bar{background:var(--mint);opacity:1}
.tl-cap{font-size:.5rem;letter-spacing:.06em;text-transform:uppercase;color:var(--smoke);margin-top:.5rem;line-height:1.3}
.tl-gap{flex:1 0 90px;border-top:2px dashed rgba(255,255,255,.28);margin:0 .5rem 26px;position:relative;min-width:90px}
.tl-gap span{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--ink);
  padding:0 .6rem;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);white-space:nowrap}

/* ── Split (slide 10) ───────────────────────────────────────────── */
.split{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(1rem,4vw,3rem);align-items:center;margin-top:2.5rem}
.split-side{text-align:center}
.split-side img{width:100%;max-width:340px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--hair)}
.split-num{font-family:'Anton',sans-serif;font-size:clamp(2.4rem,5vw,4.2rem);line-height:1;margin-top:1rem}
.split-vs{font-family:'Anton',sans-serif;font-size:1.5rem;color:var(--smoke)}

/* ── Node diagram (slide 12) ────────────────────────────────────── */
.hub{text-align:center;margin-top:2rem}
.hub-core{display:inline-block;font-family:'Anton',sans-serif;font-size:clamp(1.4rem,3vw,2.4rem);
  padding:1.1rem 2rem;border:2px solid var(--signal);border-radius:100px;color:var(--signal)}
.hub-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-top:2.5rem}
.hub-node{padding:1rem .8rem;border:1px solid var(--hair);border-radius:10px;background:rgba(255,255,255,.04);
  font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;text-align:center}
.slide.light .hub-node,.slide.cream .hub-node{background:#fff;border-color:var(--bone)}

/* ── Lift columns (slide 14) ────────────────────────────────────── */
.lift{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;margin-top:2.5rem}
.lift-col{border:1px solid var(--hair);border-radius:14px;padding:1.5rem;background:rgba(255,255,255,.03)}
.slide.light .lift-col,.slide.cream .lift-col{background:#fff;border-color:var(--bone)}
.lift-col h4{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:1rem}
.lift-col ul{list-style:none}
.lift-col li{font-size:.82rem;padding:.35rem 0 .35rem 1.1rem;position:relative;color:var(--smoke)}
.slide.light .lift-col li{color:var(--warm)}
.lift-col li::before{content:'';position:absolute;left:0;top:.85rem;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}

/* ── Flow (slide 15) ────────────────────────────────────────────── */
.flow{display:flex;gap:.6rem;margin-top:2.5rem;overflow-x:auto;padding-bottom:.5rem}
.flow-step{flex:1 0 155px;border:1px solid var(--hair);border-radius:12px;padding:1.1rem .9rem;background:rgba(255,255,255,.03)}
.slide.light .flow-step,.slide.cream .flow-step{background:#fff;border-color:var(--bone)}
.flow-when{font-size:.56rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--signal);margin-bottom:.5rem}
.flow-what{font-size:.85rem;font-weight:700;line-height:1.3}
.flow-note{font-size:.66rem;color:var(--smoke);margin-top:.4rem;line-height:1.4}
.flow-step.key{border-color:var(--signal);border-width:2px}

/* ── System (slide 16) ──────────────────────────────────────────── */
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-top:2.5rem}
.sys-card{border:1px solid var(--hair);border-radius:12px;padding:1.3rem;background:rgba(255,255,255,.03)}
.slide.light .sys-card,.slide.cream .sys-card{background:#fff;border-color:var(--bone)}
.sys-card h4{font-family:'Anton',sans-serif;font-size:1.1rem;color:var(--signal);margin-bottom:.5rem}
.sys-card p{font-size:.76rem;color:var(--smoke);line-height:1.5}
.slide.light .sys-card p{color:var(--warm)}

/* ── Source tag system ──────────────────────────────────────────────
   Three states, deliberately distinguishable at a glance:
     LIVE        current public API metric
     DATED       calculated from our stored channel readings
     OPPORTUNITY VMG interpretation, not a measurement
   Small and quiet — the viewer should absorb it, not read it.        */
.srcbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.75rem}
.src{display:inline-flex;align-items:center;gap:.4rem;font-size:.52rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);
  padding:.3rem .55rem;border:1px solid var(--hair);border-radius:4px}
.slide.light .src,.slide.cream .src{border-color:var(--bone);color:var(--warm)}
.src::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.src.live::before{background:var(--yt)}
.src.snap::before{background:var(--electric)}
.src.opp::before{background:var(--sun)}
body.present .src{font-size:.66rem}

/* ── Two-state panel (slide 17: today vs together) ──────────────── */
.states{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(1rem,3vw,2.5rem);align-items:stretch;margin-top:2rem}
.state{border:1px solid var(--hair);border-radius:14px;padding:1.6rem;background:rgba(255,255,255,.03)}
.slide.light .state,.slide.cream .state{background:#fff;border-color:var(--bone)}
.state.future{border-color:var(--signal);border-width:2px}
.state h4{font-family:'Anton',sans-serif;font-size:1.25rem;text-transform:uppercase;margin-bottom:.25rem}
.state .who{font-size:.56rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--smoke);margin-bottom:1rem}
.state ul{list-style:none}
.state li{font-size:.78rem;padding:.28rem 0 .28rem 1rem;position:relative;color:var(--smoke)}
.slide.light .state li,.slide.cream .state li{color:var(--warm)}
.state li::before{content:'';position:absolute;left:0;top:.75rem;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
.state-arrow{display:flex;align-items:center;font-family:'Anton',sans-serif;font-size:1.6rem;color:var(--signal)}

/* ── Priority tiers (slide 14) ──────────────────────────────────── */
.prio{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.1rem;margin-top:2rem}
.prio-col{border-radius:14px;padding:1.4rem;border:1px solid var(--hair);background:rgba(255,255,255,.03);position:relative}
.slide.light .prio-col,.slide.cream .prio-col{background:#fff;border-color:var(--bone)}
.prio-col.p1{border-color:var(--mint);border-width:2px}
.prio-rank{font-family:'Anton',sans-serif;font-size:.85rem;letter-spacing:.05em;margin-bottom:.15rem}
.prio-head{font-size:.68rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;margin-bottom:.9rem;line-height:1.4}
.prio-col ul{list-style:none}
.prio-col li{font-size:.78rem;padding:.28rem 0 .28rem 1rem;position:relative;color:var(--smoke)}
.slide.light .prio-col li,.slide.cream .prio-col li{color:var(--warm)}
.prio-col li::before{content:'';position:absolute;left:0;top:.75rem;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}

/* ── Funnel (slide 8) ───────────────────────────────────────────── */
.funnel{margin-top:2rem}
.fn{display:flex;align-items:center;gap:1rem;padding:.85rem 1.1rem;border-radius:10px;
  border:1px solid var(--hair);background:rgba(255,255,255,.03);margin-bottom:.5rem}
.slide.light .fn,.slide.cream .fn{background:#fff;border-color:var(--bone)}
.fn.key{border-color:var(--signal);border-width:2px}
.fn-t{font-family:'Anton',sans-serif;font-size:1rem;min-width:190px;text-transform:uppercase}
.fn-d{font-size:.78rem;color:var(--smoke)}
.slide.light .fn-d,.slide.cream .fn-d{color:var(--warm)}
.fn-arrow{text-align:center;color:var(--signal);font-size:.9rem;margin:-.15rem 0 .35rem}

/* ── Platform example card (slide 13) ───────────────────────────── */
.plat{display:grid;grid-template-columns:minmax(260px,1fr) 1fr;gap:clamp(1.2rem,3vw,2.5rem);align-items:start;margin-top:2rem}
.plat-card{display:block;text-decoration:none;color:inherit;border-radius:12px;overflow:hidden;
  border:1px solid var(--hair);background:rgba(255,255,255,.04);transition:transform .3s ease}
.plat-card:hover{transform:translateY(-4px)}
.plat-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.plat-meta{padding:.85rem 1rem}
.plat-title{font-size:.92rem;font-weight:800}
.plat-chan{font-size:.68rem;color:var(--smoke);margin-top:.2rem}
.plat-cta{font-size:.6rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--signal);margin-top:.6rem}

/* ── Evidence tag ───────────────────────────────────────────────── */
.evid{display:inline-block;font-size:.55rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:.28rem .6rem;border-radius:4px;margin-top:1.5rem}
.evid.obs{background:rgba(31,190,122,.15);color:var(--mint);border:1px solid rgba(31,190,122,.4)}
.evid.hyp{background:rgba(255,210,76,.14);color:var(--sun);border:1px solid rgba(255,210,76,.4)}
.slide.light .evid.obs,.slide.cream .evid.obs{background:rgba(31,190,122,.12);color:#0d7a4a}
.slide.light .evid.hyp,.slide.cream .evid.hyp{background:rgba(255,169,0,.14);color:#8a6100;border-color:rgba(255,169,0,.45)}

/* ── Hero image ─────────────────────────────────────────────────── */
.bleed{position:absolute;inset:0;z-index:0}
.bleed img{width:100%;height:100%;object-fit:cover;filter:grayscale(.25) contrast(1.12)}
.bleed::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,11,11,.55) 0%,rgba(11,11,11,.72) 55%,rgba(11,11,11,.95) 100%)}

/* ── Chrome (hidden in presentation mode) ───────────────────────── */
.chrome{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;justify-content:space-between;
  align-items:center;padding:.75rem 1.25rem;background:rgba(11,11,11,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--hair)}
.chrome-l{display:flex;align-items:center;gap:.9rem;font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}
.chrome-r{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{font-family:inherit;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:.5rem .85rem;border-radius:6px;border:1px solid var(--hair);background:transparent;color:var(--paper);cursor:pointer;transition:all .2s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
/* Icon-only refresh: square so it reads as an affordance, not a third label
   competing with Present and Analysis. Spins while the fetch is in flight. */
.btn.icon{padding:0;width:1.95rem;height:1.95rem;display:inline-flex;align-items:center;justify-content:center}
.btn.icon svg{display:block}
.btn.icon.spinning svg{animation:spin .8s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
body.present .chrome{display:none}
body.present{overflow:hidden}

/* ── Presentation mode ──────────────────────────────────────────── */
body.present .slide{display:none;min-height:100vh;height:100vh;border:none}
body.present .slide.current{display:flex}
body.present .reveal,body.present .stagger>*{opacity:1;transform:none;transition:none}
body.present .deck{padding-top:0}
.pbar{display:none;position:fixed;bottom:0;left:0;height:3px;background:var(--signal);z-index:1000;transition:width .3s ease}
body.present .pbar{display:block}
.pcount{display:none;position:fixed;bottom:1rem;right:1.25rem;z-index:1000;font-size:.6rem;font-weight:700;
  letter-spacing:.14em;color:var(--smoke);background:rgba(11,11,11,.75);padding:.35rem .7rem;border-radius:5px}
body.present .pcount{display:block}
.phint{display:none;position:fixed;bottom:1rem;left:1.25rem;z-index:1000;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--smoke);opacity:.5}
body.present .phint{display:block}

/* 16:9 scaling in presentation mode — keeps type proportional on any display */
body.present .inner{max-width:min(1240px,calc((100vh - 6rem) * 16 / 9))}

.deck{padding-top:52px}
body.present .slide{padding:clamp(1.5rem,4vh,3.5rem) clamp(2rem,5vw,5rem);overflow-y:auto;justify-content:safe center}

/* Dense slides (thumbnail grids, stat rows) are tightened in presentation mode
   so a 16:9 projector never clips content. Nothing important should require
   scrolling while someone is presenting. */
body.present .thumb-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.7rem;margin-top:1.5rem}
body.present .thumb-grid .tmeta{padding:.5rem .6rem}
body.present .thumb-grid .ttitle{font-size:.66rem;-webkit-line-clamp:1}
body.present .thumb-grid .tviews{font-size:.95rem;margin-top:.25rem}
body.present .stat-row{margin-top:1.5rem}
body.present .sub{margin-top:1rem;font-size:clamp(.85rem,1.15vw,1.05rem)}
body.present .hub-out{margin-top:1.2rem;grid-template-columns:repeat(4,1fr)}
body.present .thumb-grid{grid-template-columns:repeat(4,1fr)}
body.present .lift,body.present .sys,body.present .flow{margin-top:1.5rem}
body.present .evid{margin-top:1rem;font-size:.72rem}
body.present .tl-cap{font-size:.66rem}
body.present .flow-when{font-size:.68rem}
body.present .tsub{font-size:.7rem}
body.present .stat .cap{font-size:.76rem}
body.present .stat .sub2{font-size:.72rem}
body.present .kicker,body.present .label{font-size:.82rem}
body.present .tl-gap span{font-size:.72rem}

/* ── Appendix / brief ───────────────────────────────────────────── */
.sheet{display:none;padding:5rem clamp(1rem,5vw,4rem);background:var(--paper);color:var(--ink);min-height:100vh}
.sheet.open{display:block}
body.present .sheet{display:none!important}
/* When a sheet is open the deck must be hidden, otherwise scrolling to top
   lands the reader back on slide 1 instead of the document they asked for. */
body.sheet-open .deck{display:none}
.sheet-in{max-width:1000px;margin:0 auto}
.sheet h2{font-family:'Anton',sans-serif;font-size:2.4rem;margin-bottom:.5rem;text-transform:uppercase}
.sheet h3{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--signal);margin:2.5rem 0 .9rem}
.sheet p{font-size:.88rem;color:var(--warm);margin-bottom:.7rem;max-width:70ch}
.sheet ul{margin:0 0 1rem 1.1rem}
.sheet li{font-size:.85rem;color:var(--warm);margin-bottom:.4rem}
table{width:100%;border-collapse:collapse;margin:1rem 0 1.5rem;font-size:.78rem}
th{text-align:left;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--smoke);border-bottom:2px solid var(--ink);padding:.55rem .5rem}
td{padding:.55rem .5rem;border-bottom:1px solid var(--bone);color:var(--warm)}
td.n{font-family:'Anton',sans-serif;font-size:.95rem;color:var(--ink)}
.note{background:var(--cream);border-left:3px solid var(--signal);padding:1rem 1.2rem;margin:1.2rem 0;font-size:.8rem;color:var(--warm)}

@media(max-width:760px){
  .split{grid-template-columns:1fr}
  .split-vs{display:none}
  .stat-row{gap:1.5rem}
}
</style>
</head>
<body>

<!-- ══ CHROME ══════════════════════════════════════════════════ -->
<div class="chrome">
  <div class="chrome-l">

/* ═══════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════ */
const S = ARTIST.analysisSnapshot;

/* ── Derived format metrics ────────────────────────────────────────────
   Every format count, share and multiple shown anywhere in this deck is
   computed here from S.tiers. Nothing downstream hardcodes a ratio, so a
   change to the classification can never leave a stale number on a slide. */
const TIER          = n => S.tiers.find(t => t.name === n);
const TIER_UPLOADS  = S.tiers.reduce((a,t) => a + t.n, 0);
const TIER_VIEWS    = S.tiers.reduce((a,t) => a + t.total, 0);
const ratio         = (a,b) => TIER(a).median / TIER(b).median;
const shareUploads  = n => TIER(n).n     / TIER_UPLOADS * 100;
const shareViews    = n => TIER(n).total / TIER_VIEWS   * 100;
const pct           = (v,d=0) => v.toFixed(d) + '%';
const times         = (a,b) => ratio(a,b).toFixed(1) + '\u00d7';
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+'M' : n>=1e3 ? (n/1e3).toFixed(n>=1e4?0:1)+'K' : String(n);
const thumb = (id,q='hqdefault') => `https://i.ytimg.com/vi/${id}/${q}.jpg`;
const yt = id => `https://www.youtube.com/watch?v=${id}`;
/* Full-bleed background from a channel thumbnail. maxresdefault gives the
   sharpest image but doesn't exist for every video, so it falls back to
   hqdefault rather than showing a broken frame behind the headline. */
const heroImg = id =>
  `<img src="${thumb(id,'maxresdefault')}" alt="Amyl and The Sniffers"
        onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'">`;

/* Live figure with dated fallback. Every headline number routes through this
   so the LIVE / dated label can never drift from the value shown. */
function liveOr(path, fallback){
  const L = ARTIST.liveData;
  if (L && L[path] != null) return {v:L[path], live:true};
  return {v:fallback, live:false};
}

/* ═══════════════════════════════════════════════════════════════════
   LIVE DATA — fetched from the existing YouTube data pipeline.
   Fails soft: if the API is unreachable the deck keeps the verified
   stored values and dates them. It must never show a blank number
   in front of a room.
   ═══════════════════════════════════════════════════════════════════ */
function renderStats(){
  const subs   = liveOr('subscriberCount', S.subscribers);
  const views  = liveOr('viewCount',       S.lifetimeViews);
  const vids   = liveOr('videoCount',      S.publicVideos);

  document.getElementById('liveStats').innerHTML = [
    [fmt(subs.v),  'Subscribers'],
    [fmt(views.v), 'Lifetime views'],
    [vids.v,       'Public videos'],
    ['+'+fmt(S.recentWindowViews), 'Views in the last 7 days'],
  ].map(([n,l])=>`
    <div class="stat">
      <div class="num" ${l==='Views arriving recently'?'style="color:var(--mint)"':''}>${n}</div>
      <div class="cap">${l}</div>
    </div>`).join('');


  /* Latest uploads strip */
  const vids2 = (ARTIST.liveData && ARTIST.liveData.latestVideos) || null;
  const grid = document.getElementById('latestGrid');
  if (vids2 && vids2.length){
    /* Show one card per format rather than the four newest uploads.
       The newest uploads are almost always Shorts, which made this read as a
       Shorts feed and hid the fact that the channel has assets across formats.
       Each card is the best-performing example of its format, so the strip
       shows range and scale at the same time. */
    const OMV_IDS   = new Set(S.omvs.map(o=>o.id));
    const LIVE_EXTRA = new Set(['AaGu-fR2wrU']); // "Guided By Angels (Live)" — the API types this 'unknown'
    const formatOf = v =>
      v.kind === 'short'                                    ? 'Short' :
      OMV_IDS.has(v.videoId)                                ? 'Music video' :
      (v.videoType === 'live' || LIVE_EXTRA.has(v.videoId)) ? 'Live' :
      /making of|behind the scenes/i.test(v.title)          ? 'Behind the scenes' :
      /offici?al audio/i.test(v.title)                      ? 'Official audio' :  // 'Offical' is a typo in one real title
      /q\s*&\s*a/i.test(v.title)                            ? 'Fan Q&A' :
                                                              'Early catalogue video';

    const byViews = [...vids2].sort((a,b) => b.views - a.views);
    const wanted  = ['Music video','Live','Behind the scenes','Short'];
    const picked  = [];
    wanted.forEach(f => { const hit = byViews.find(v => formatOf(v) === f); if (hit) picked.push([f, hit]); });
    // If a format is missing entirely, top up with the next best of anything unused.
    byViews.forEach(v => { if (picked.length < 4 && !picked.some(([,p]) => p.videoId === v.videoId)) picked.push([formatOf(v), v]); });

    grid.innerHTML = picked.slice(0,4).map(([label,v])=>`
      <a class="tcard" href="${yt(v.videoId)}" target="_blank" rel="noopener">
        <img src="${thumb(v.videoId)}" alt="${esc(v.title)}" loading="lazy">
        <div class="tmeta">
          <div class="tsub" style="color:var(--signal)">${label} · ${new Date(v.publishedAt).getFullYear()}</div>
          <div class="ttitle" style="margin-top:.3rem">${esc(v.title)}</div>
          <div class="tviews">${fmt(v.views)}</div></div></a>`).join('');
  } else {
    grid.innerHTML = S.omvs.slice(0,4).map(o=>`
      <a class="tcard" href="${yt(o.id)}" target="_blank" rel="noopener">
        <img src="${thumb(o.id)}" alt="${esc(o.t)}" loading="lazy">
        <div class="tmeta"><div class="tsub">Catalogue · ${o.y}</div>
        <div class="ttitle" style="margin-top:.3rem">${esc(o.t)}</div>
        <div class="tviews">${fmt(o.v)}</div></div></a>`).join('');
  }

  /* These two containers are `.stagger`, so their children start at opacity 0
     and normally wait for the IntersectionObserver. But the observer fires once
     and unobserves — so anything re-rendered by a later refresh would never be
     revealed. Mark the fresh children visible directly. */
  ['liveStats','latestGrid'].forEach(id=>{
    const host = document.getElementById(id);
    if(!host) return;
    [...host.children].forEach((c,i)=>setTimeout(()=>c.classList.add('visible'), i*70));
  });
}

async function refreshLive(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning'); btn.disabled = true;
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 6000);
    const r = await fetch(`${ARTIST.meta.apiBase}?slug=${ARTIST.meta.slug}`,
                          {cache:'no-store', signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('status '+r.status);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    /* Only genuinely live metrics are adopted. Analytical findings are untouched. */
    ARTIST.liveData = {
      subscriberCount: d.state?.subscriberCount ?? null,
      viewCount:       d.state?.viewCount ?? null,
      videoCount:      d.state?.videoCount ?? null,
      latestVideos:    d.state?.latestVideos ?? null,
      checkedAt:       d.state?.checkedAt ?? null,
    };
  }catch(e){
    console.warn('[Amyl deck] live refresh unavailable —', e.message, '· keeping verified stored data');
    ARTIST.liveData = null;
  }
  renderStats();
  btn.classList.remove('spinning'); btn.disabled = false;
}

/* ═══════════════════════════════════════════════════════════════════
   REVEAL OBSERVERS
   ═══════════════════════════════════════════════════════════════════ */
function observeAll(){
  const ro = new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target);}
  }),{threshold:.1,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal:not(.visible)').forEach(el=>ro.observe(el));

  const so = new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){
      [...e.target.children].forEach((c,i)=>setTimeout(()=>c.classList.add('visible'),i*90));
      o.unobserve(e.target);
    }
  }),{threshold:.05});
  document.querySelectorAll('.stagger').forEach(el=>so.observe(el));

  const bo = new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){
      e.target.querySelectorAll('.bar-fill').forEach((f,i)=>
        setTimeout(()=>f.style.width=f.dataset.w+'%', i*100));
      o.unobserve(e.target);
    }
  }),{threshold:.2});
  document.querySelectorAll('.slide').forEach(el=>bo.observe(el));
}

/* ═══════════════════════════════════════════════════════════════════
   PRESENTATION MODE
   ═══════════════════════════════════════════════════════════════════ */
let cur = 0;
const allSlides = () => [...document.querySelectorAll('.slide')];

function startPresent(){
  closeSheets();
  document.body.classList.add('present');
  cur = 0; showSlide(0);
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
}
function exitPresent(){
  document.body.classList.remove('present');
  allSlides().forEach(s=>s.classList.remove('current'));
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  allSlides()[cur]?.scrollIntoView({block:'start'});
}
function showSlide(i){
  const s = allSlides();
  cur = Math.max(0, Math.min(i, s.length-1));
  s.forEach((el,n)=>el.classList.toggle('current', n===cur));
  /* Everything visible immediately — no hover or scroll needed to read a slide. */
  s[cur].querySelectorAll('.reveal,.stagger>*').forEach(e=>e.classList.add('visible'));
  s[cur].querySelectorAll('.bar-fill').forEach((f,n)=>setTimeout(()=>f.style.width=f.dataset.w+'%', n*90));
  document.getElementById('pbar').style.width = ((cur+1)/s.length*100)+'%';
  document.getElementById('pcount').textContent = `${cur+1} / ${s.length}`;
}
document.addEventListener('keydown', e=>{
  if(!document.body.classList.contains('present')){
    if(e.key==='Escape') closeSheets();
    return;
  }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();showSlide(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();showSlide(cur-1);}
  else if(e.key==='Escape'){exitPresent();}
  else if(e.key==='Home'){showSlide(0);}
  else if(e.key==='End'){showSlide(allSlides().length-1);}
});
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('present')) exitPresent();
});
