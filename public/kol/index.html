<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kings of Leon × YouTube — September 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   KINGS OF LEON × YOUTUBE — September 2026 campaign strategy

   Visual identity is deliberately NOT the Amyl deck. Amyl was punk:
   hard black, signal red, Anton. This is a heritage rock catalogue —
   warm near-black, aged gold, Oswald. Cinematic rather than abrasive.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --ink:#0B0B0C;          /* warm near-black */
  --coal:#141416;
  --paper:#EFEAE3;        /* warm bone */
  --bone:#DED6CA;
  --signal:#C8963E;       /* aged gold */
  --ember:#B4472B;        /* rust, secondary accent */
  --smoke:#8A8580;
  --hair:rgba(239,234,227,.14);
  --mint:#7FA88C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.display{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:-.005em;line-height:.98;
  text-transform:uppercase}
.display.big{font-size:clamp(2.6rem,7.4vw,6.4rem)}
.display.mid{font-size:clamp(1.7rem,3.9vw,3.2rem)}

/* ── Chrome ─────────────────────────────────────────────────────── */
.chrome{position:fixed;top:0;left:0;right:0;height:58px;background:rgba(11,11,12,.93);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);display:flex;
  align-items:center;justify-content:space-between;padding:0 1.6rem;z-index:900}
.chrome-l{display:flex;align-items:center;gap:.9rem;font-size:.6rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--smoke)}
.chrome-r{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{font-family:inherit;font-size:.58rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:.5rem .85rem;border-radius:4px;border:1px solid var(--hair);background:transparent;
  color:var(--paper);cursor:pointer;transition:all .2s}
.btn:hover{background:rgba(239,234,227,.09)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#1A1206}
.btn:disabled{opacity:.5;cursor:default}
.btn.icon{padding:0;width:1.95rem;height:1.95rem;display:inline-flex;align-items:center;justify-content:center}
.btn.icon svg{display:block}
.btn.icon.spinning svg{animation:spin .8s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
body.present .chrome{display:none}
body.present{overflow:hidden}

/* ── Slides ─────────────────────────────────────────────────────── */
.deck{padding-top:58px}
.slide{min-height:100vh;display:flex;align-items:center;position:relative;
  padding:5rem 1.6rem;border-bottom:1px solid rgba(239,234,227,.07);overflow:hidden}
.slide .inner{max-width:1240px;margin:0 auto;width:100%;position:relative;z-index:2}
.slide.light{background:var(--paper);color:var(--ink)}
.slide.light .display{color:var(--ink)}
.slide.coal{background:var(--coal)}
.bleed{position:absolute;inset:0;z-index:0;overflow:hidden}
.bleed img{width:100%;height:100%;object-fit:cover;opacity:.3}
.bleed::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,var(--ink) 8%,rgba(11,11,12,.72) 52%,rgba(11,11,12,.45))}
.label{font-size:.62rem;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
  color:var(--signal);margin-bottom:1.1rem}
.sub{font-size:clamp(.95rem,1.3vw,1.12rem);line-height:1.62;color:var(--smoke);max-width:66ch;margin-top:1.3rem}
.slide.light .sub{color:#5A554E}
.statement{font-size:clamp(1.05rem,1.9vw,1.5rem);line-height:1.45;font-weight:500}

/* ── Stats ──────────────────────────────────────────────────────── */
.stat-row{display:flex;gap:clamp(1.4rem,4.5vw,4rem);flex-wrap:wrap;margin-top:2.4rem}
.stat .num{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(2rem,5.2vw,4.2rem);
  line-height:1;color:var(--paper)}
.slide.light .stat .num{color:var(--ink)}
.stat .cap{font-size:.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--smoke);margin-top:.5rem}
.stat .sub2{font-size:.66rem;color:var(--smoke);opacity:.75;margin-top:.3rem}

/* ── Thumbnails ─────────────────────────────────────────────────── */
.thumb-grid{display:grid;gap:1rem;margin-top:2.4rem}
.thumb-grid.g5{grid-template-columns:repeat(5,1fr)}
.thumb-grid.g4{grid-template-columns:repeat(4,1fr)}
.thumb-grid.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.thumb-grid.g5,.thumb-grid.g4{grid-template-columns:repeat(2,1fr)}}
.tcard{display:block;text-decoration:none;color:inherit;border-radius:6px;overflow:hidden;
  background:rgba(239,234,227,.05);border:1px solid var(--hair);transition:transform .3s ease}
.slide.light .tcard{background:#fff;border-color:var(--bone)}
.tcard:hover{transform:translateY(-4px)}
.tcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.tmeta{padding:.7rem .8rem}
.ttitle{font-size:.74rem;font-weight:600;line-height:1.32}
.tviews{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.1rem;color:var(--signal);margin-top:.3rem}
.tsub{font-size:.62rem;color:var(--smoke);margin-top:.15rem}

/* ── Bars ───────────────────────────────────────────────────────── */
.bar-row{margin-bottom:1rem}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.35rem}
.bar-name{font-size:.78rem;font-weight:600}
.bar-val{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.05rem}
.bar-track{height:9px;background:rgba(239,234,227,.1);border-radius:99px;overflow:hidden}
.slide.light .bar-track{background:rgba(11,11,12,.09)}
.bar-fill{height:100%;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.3,1)}

/* ── Era columns ────────────────────────────────────────────────── */
.eras{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2.2rem}
@media(max-width:820px){.eras{grid-template-columns:repeat(2,1fr)}}
.era{border:1px solid var(--hair);border-radius:8px;padding:1.2rem 1rem;background:rgba(239,234,227,.03)}
.slide.light .era{border-color:var(--bone);background:#fff}
.era.key{border-color:var(--signal);border-width:2px}
.era-yr{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.15rem;color:var(--signal)}
.era-n{font-size:.68rem;color:var(--smoke);margin-top:.5rem;letter-spacing:.04em}
.era-big{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(1.5rem,3.4vw,2.5rem);margin-top:.45rem}

/* ── Flow / funnel ──────────────────────────────────────────────── */
.flow{display:flex;gap:.85rem;flex-wrap:wrap;margin-top:2.2rem}
.flow-step{flex:1 0 150px;border:1px solid var(--hair);border-radius:8px;padding:1rem .9rem;
  background:rgba(239,234,227,.03)}
.slide.light .flow-step{border-color:var(--bone);background:#fff}
.flow-step.key{border-color:var(--signal);border-width:2px}
.flow-when{font-size:.55rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--signal);margin-bottom:.45rem}
.flow-what{font-size:.83rem;font-weight:700;line-height:1.3}
.flow-note{font-size:.65rem;color:var(--smoke);margin-top:.35rem;line-height:1.42}
/* ── Same-point comparison against the 2024 campaign ─────────────── */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-top:1.9rem}
.vs-col{border:1px solid var(--hair);border-radius:10px;padding:1.15rem 1.1rem;
  background:rgba(239,234,227,.03)}
.slide.light .vs-col{border-color:var(--bone);background:#fff}
.vs-col.now{border-color:var(--ember)}
.vs-yr{font-size:.57rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--smoke);margin-bottom:.55rem}
.vs-col.now .vs-yr{color:var(--ember)}
.vs-n{font-family:'Oswald',sans-serif;font-size:3rem;line-height:.95;font-weight:600;color:var(--signal)}
.vs-col.now .vs-n{color:var(--ember)}
.vs-lab{font-size:.68rem;color:var(--smoke);margin-bottom:.5rem;line-height:1.4}
.vs-list{list-style:none;margin-top:.5rem}
.vs-list li{font-size:.71rem;line-height:1.45;padding:.3rem 0;border-top:1px solid var(--hair);
  display:flex;gap:.55rem;align-items:baseline}
.slide.light .vs-list li{border-top-color:var(--bone)}
.vs-t{color:var(--signal);font-weight:700;flex:0 0 2.5rem;font-size:.6rem;letter-spacing:.04em}
.vs-v{margin-left:auto;color:var(--smoke);font-size:.62rem;white-space:nowrap;padding-left:.5rem}
.vs-none{font-size:.72rem;color:var(--ember);padding:.55rem 0;line-height:1.5}

/* ── The 2024 campaign shape, as targets ─────────────────────────── */
.bm{margin-top:1.9rem;display:flex;flex-direction:column;gap:.5rem}
.bm-row{display:grid;grid-template-columns:2.2rem 1fr auto;gap:1rem;align-items:center;
  border:1px solid var(--hair);border-radius:8px;padding:.8rem 1rem;background:rgba(239,234,227,.03)}
.slide.light .bm-row{border-color:var(--bone);background:#fff}
.bm-n{font-size:.58rem;font-weight:700;letter-spacing:.12em;color:var(--signal)}
.bm-t{font-size:.83rem;font-weight:700;line-height:1.3}
.bm-d{font-size:.66rem;color:var(--smoke);margin-top:.22rem;line-height:1.45}
.bm-v{font-family:'Oswald',sans-serif;font-size:1.35rem;font-weight:600;color:var(--signal);
  white-space:nowrap;text-align:right}
@media(max-width:860px){
  .vs{grid-template-columns:1fr}
  .bm-row{grid-template-columns:2rem 1fr;row-gap:.4rem}
  .bm-v{grid-column:2;text-align:left}
}

/* ── Campaign phases / format bars ───────────────────────────────── */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.8rem}
.ph-c{border:1px solid var(--hair);border-radius:10px;padding:1.05rem;background:rgba(239,234,227,.03)}
.slide.light .ph-c{border-color:var(--bone);background:#fff}
.ph-n{font-size:.57rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
.ph-w{font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:600;margin:.3rem 0 .1rem}
.ph-d{font-size:.62rem;color:var(--smoke);margin-bottom:.5rem}
.ph-b{font-size:.72rem;line-height:1.5}

/* ── Learning → Action → Tool map ────────────────────────────────── */
.map{margin-top:1.7rem;display:flex;flex-direction:column;gap:.5rem}
.map-r{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.8rem;align-items:center;
  border:1px solid var(--hair);border-radius:8px;padding:.75rem .95rem;background:rgba(239,234,227,.03)}
.slide.light .map-r{border-color:var(--bone);background:#fff}
.map-l{font-size:.76rem;line-height:1.35;color:var(--smoke)}
.map-a{font-size:.8rem;line-height:1.35;font-weight:700}
.map-t{font-size:.68rem;line-height:1.35;color:var(--signal);font-weight:700;text-align:right}
.map-x{color:var(--signal);font-size:.8rem}
.map-h{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.8rem;padding:0 .95rem .3rem;
  font-size:.55rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}
.map-h span:last-child{text-align:right}

/* ── Toolkit ─────────────────────────────────────────────────────── */
.kit{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-top:1.7rem}
.kit-c{border:1px solid var(--hair);border-radius:9px;padding:.9rem .85rem;background:rgba(239,234,227,.03)}
.slide.light .kit-c{border-color:var(--bone);background:#fff}
.kit-n{font-family:'Oswald',sans-serif;font-size:1.02rem;font-weight:600;margin-bottom:.15rem}
.kit-j{font-size:.6rem;font-weight:700;letter-spacing:.05em;color:var(--signal);margin-bottom:.42rem;line-height:1.3}
.kit-b{font-size:.65rem;line-height:1.48;color:var(--smoke)}

/* ── Then / now connected diagram ────────────────────────────────── */
.tn{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:1.8rem}
.tn-c{border:1px solid var(--hair);border-radius:10px;padding:1.2rem 1.1rem;background:rgba(239,234,227,.03)}
.slide.light .tn-c{border-color:var(--bone);background:#fff}
.tn-c.key{border-color:var(--signal)}
.tn-h{font-size:.57rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--smoke);margin-bottom:.85rem}
.tn-c.key .tn-h{color:var(--signal)}
.tn-s{font-size:.85rem;font-weight:700;padding:.42rem 0;line-height:1.3}
.tn-ar{color:var(--smoke);font-size:.72rem;padding-left:.1rem}
.tn-c.key .tn-ar{color:var(--signal)}
.tn-w{font-size:.66rem;color:var(--smoke);font-weight:400;display:block;margin-top:.1rem}
@media(max-width:900px){
  .ph,.tn{grid-template-columns:1fr}
  .kit{grid-template-columns:repeat(2,1fr)}
  .map-r,.map-h{grid-template-columns:1fr;gap:.3rem}
  .map-t,.map-h span:last-child{text-align:left}
  .map-x{display:none}
}
.funnel{margin-top:2rem;max-width:660px}
.fn{border:1px solid var(--hair);border-left:3px solid var(--hair);border-radius:6px;
  padding:.85rem 1rem;background:rgba(239,234,227,.03)}
.slide.light .fn{border-color:var(--bone);background:#fff}
.fn.key{border-left-color:var(--signal);border-color:var(--signal)}
.fn-t{font-size:.85rem;font-weight:700}
.fn-d{font-size:.68rem;color:var(--smoke);margin-top:.2rem}
.fn-arrow{text-align:center;color:var(--signal);font-size:1rem;margin:.45rem 0}

/* ── Priority columns ───────────────────────────────────────────── */
.prio{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.2rem}
@media(max-width:900px){.prio{grid-template-columns:1fr}}
.prio-col{border-radius:8px;padding:1.3rem;border:1px solid var(--hair);background:rgba(239,234,227,.03)}
.slide.light .prio-col{border-color:var(--bone);background:#fff}
.prio-col.p1{border-color:var(--signal);border-width:2px}
.prio-rank{font-family:'Oswald',sans-serif;font-size:.85rem;letter-spacing:.05em;margin-bottom:.15rem}
.prio-head{font-size:.66rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  margin-bottom:.85rem;line-height:1.4}
.prio-col ul{list-style:none}
.prio-col li{font-size:.76rem;padding:.26rem 0 .26rem 1rem;position:relative;color:var(--smoke)}
.prio-col li::before{content:'';position:absolute;left:0;top:.72rem;width:4px;height:4px;
  border-radius:50%;background:currentColor;opacity:.55}

/* ── Recommendations ────────────────────────────────────────────── */
.rec{border-top:1px solid var(--hair);padding:1.1rem 0;display:grid;
  grid-template-columns:2.5rem 1fr;gap:1.2rem;align-items:start}
.slide.light .rec{border-color:var(--bone)}
.rec-n{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.6rem;color:var(--signal);line-height:1}
.rec-t{font-size:1rem;font-weight:700;letter-spacing:.01em}
.rec-o{font-size:.75rem;color:var(--smoke);margin-top:.35rem;line-height:1.55}
.rec-a{font-size:.79rem;margin-top:.4rem;line-height:1.5}

/* ── Two-state (see vs unlock) ──────────────────────────────────── */
.states{display:grid;grid-template-columns:1fr auto 1fr;gap:1.6rem;align-items:start;margin-top:2rem}
@media(max-width:900px){.states{grid-template-columns:1fr}}
.state{border:1px solid var(--hair);border-radius:8px;padding:1.3rem;background:rgba(239,234,227,.03)}
.state.future{border-color:var(--signal)}
.state h4{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--signal);margin-bottom:.85rem}
.state ul{list-style:none}
.state li{font-size:.76rem;padding:.24rem 0 .24rem .95rem;position:relative;color:var(--smoke)}
.state li::before{content:'';position:absolute;left:0;top:.68rem;width:4px;height:4px;
  border-radius:50%;background:currentColor;opacity:.5}
.state-arrow{align-self:center;color:var(--signal);font-size:1.4rem}

/* ── Source labels ──────────────────────────────────────────────── */
.srcbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:2rem}
.src{display:inline-flex;align-items:center;gap:.4rem;font-size:.55rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;padding:.36rem .7rem;border-radius:99px;
  border:1px solid var(--hair);color:var(--smoke)}
.slide.light .src{border-color:var(--bone)}
.src.opp{color:var(--signal);border-color:rgba(200,150,62,.4)}

/* ── Reveal ─────────────────────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .75s ease,transform .75s ease}
.reveal.visible{opacity:1;transform:none}
.stagger>*{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.stagger>*.visible{opacity:1;transform:none}

/* ── Presentation mode ──────────────────────────────────────────── */
body.present .deck{padding-top:0}
body.present .slide{display:none;min-height:100vh;height:100vh;padding:3.5rem 4vw}
body.present .slide.active{display:flex}
body.present .reveal,body.present .stagger>*{opacity:1;transform:none}
.pbar{position:fixed;top:0;left:0;height:2px;background:var(--signal);width:0;z-index:1000;
  transition:width .3s;display:none}
body.present .pbar{display:block}
.pcount{position:fixed;bottom:1.1rem;right:1.4rem;font-size:.62rem;letter-spacing:.14em;
  color:var(--smoke);z-index:1000;display:none}
body.present .pcount{display:block}
.phint{position:fixed;bottom:1.1rem;left:1.4rem;font-size:.58rem;letter-spacing:.1em;
  color:var(--smoke);opacity:.45;z-index:1000;display:none}
body.present .phint{display:block}

/* ── Sheet (appendix) ───────────────────────────────────────────── */
.sheet{position:fixed;inset:0;background:var(--paper);color:var(--ink);z-index:1200;
  overflow-y:auto;padding:3.5rem 1.6rem;display:none}
.sheet.open{display:block}
body.sheet-open .deck{display:none}
.sheet-in{max-width:940px;margin:0 auto}
.sheet h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:2.2rem;text-transform:uppercase;margin-bottom:.4rem}
.sheet h3{font-family:'Oswald',sans-serif;font-weight:600;font-size:.95rem;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ember);margin:2.2rem 0 .7rem}
.sheet p{font-size:.86rem;line-height:1.65;margin-bottom:.7rem;color:#3D3931}
.sheet table{width:100%;border-collapse:collapse;margin:.6rem 0 1rem;font-size:.8rem}
.sheet th{text-align:left;font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--smoke);padding:.5rem .6rem;border-bottom:2px solid var(--ink)}
.sheet td{padding:.5rem .6rem;border-bottom:1px solid var(--bone)}
.sheet td.n{font-family:'Oswald',sans-serif;font-weight:600;text-align:right}
.sheet .note{background:rgba(11,11,12,.05);border-left:3px solid var(--ember);
  padding:.9rem 1.1rem;font-size:.82rem;line-height:1.6;margin:1rem 0;color:#3D3931}
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-l">
    <span style="color:var(--signal)">KINGS OF LEON × YOUTUBE</span>
    <span>September 2026</span>
  </div>
  <div class="chrome-r">
    <button class="btn primary" onclick="startPresent()">Present</button>
    <button class="btn" onclick="openSheet('appendix')">Analysis</button>
    <button class="btn icon" onclick="refreshLive()" id="refreshBtn"
            title="Refresh YouTube data" aria-label="Refresh YouTube data">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
      </svg>
    </button>
  </div>
</div>

<div class="pbar" id="pbar"></div>
<div class="pcount" id="pcount"></div>
<div class="phint">← → navigate · esc exit</div>

<div class="deck" id="deck"></div>
<div class="sheet" id="sheet-appendix"><div class="sheet-in" id="appendixBody"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   DATA LAYER — one source of truth.

   Retrieved 24 Aug 2026 from YouTube Data API v3 via
   /api/full-catalogue?handle=@kingsofleon  (channel UCfJein8E4rcYZSUCc8UqyMA).
   No YouTube Studio or private Analytics data is used anywhere in this deck.

   Every figure on every slide is computed from this object at render time.
   Nothing is hardcoded twice.
   ═══════════════════════════════════════════════════════════════════ */
const ARTIST = {
  meta:{
    name:'Kings of Leon', slug:'kingsofleon', handle:'@kingsofleon',
    channelId:'UCfJein8E4rcYZSUCc8UqyMA',
    apiBase:'https://youtube-campaign-coach.vercel.app/api/artist-live',
    capturedAt:'24 Aug 2026',
  },

  /* Hero imagery — swappable. Any public YouTube video ID from the catalogue.

document.getElementById('deck').innerHTML = slides().join('');

function renderStats(){
  const subs  = liveOr('subscriberCount', C.subscribers);
  const views = liveOr('viewCount',       C.lifetimeViews);
  document.getElementById('liveStats').innerHTML = [
    [fmt(subs.v),                'Subscribers'],
    [fmt(views.v),               'Lifetime channel views'],
    [String(C.retrievedUploads), 'Retrievable public uploads'],
    [fmt(C.visibleViews),        'Attributable visible views'],
  ].map(([n,l])=>`
    <div class="stat"><div class="num">${n}</div><div class="cap">${l}</div></div>`).join('');
  [...document.getElementById('liveStats').children]
    .forEach((c,i)=>setTimeout(()=>c.classList.add('visible'), i*70));
}

async function refreshLive(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning'); btn.disabled = true;
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 7000);
    const r = await fetch(`${A.meta.apiBase}?slug=${A.meta.slug}`, {cache:'no-store', signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('status '+r.status);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    /* Only channel-level live figures are adopted. Catalogue analysis is fixed
       to the 24 Aug retrieval so every derived percentage stays internally consistent. */
    A.liveData = {
      subscriberCount: d.state?.subscriberCount ?? null,
      viewCount:       d.state?.viewCount ?? null,
    };
  }catch(e){
    console.warn('[KoL deck] live refresh unavailable —', e.message, '· keeping captured data');
    A.liveData = null;
  }
  renderStats();
  btn.classList.remove('spinning'); btn.disabled = false;
}

/* ── Reveal observers ──────────────────────────────────────────── */
function observeAll(){
  const ro = new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target);}
  }),{threshold:.1,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal:not(.visible)').forEach(el=>ro.observe(el));

  const so = new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){
      [...e.target.children].forEach((c,i)=>setTimeout(()=>c.classList.add('visible'),i*80));
      o.unobserve(e.target);
    }
  }),{threshold:.1});
  document.querySelectorAll('.stagger').forEach(el=>so.observe(el));

  const bo = new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){
      e.target.querySelectorAll('.bar-fill').forEach((b,i)=>
        setTimeout(()=>b.style.width=b.dataset.w+'%', 120+i*110));
      o.unobserve(e.target);
    }
  }),{threshold:.2});
  document.querySelectorAll('.slide').forEach(el=>bo.observe(el));
}

/* ── Sheets ────────────────────────────────────────────────────── */
function openSheet(id){
  document.getElementById('sheet-'+id).classList.add('open');
  document.body.classList.add('sheet-open');
  window.scrollTo(0,0);
}
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));
  document.body.classList.remove('sheet-open');
}

/* ── Presentation mode ─────────────────────────────────────────── */
let cur = 0;
function allSlides(){ return [...document.querySelectorAll('.slide')]; }
function startPresent(){
  document.body.classList.add('present');
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  showSlide(0);
}
function exitPresent(){
  document.body.classList.remove('present');
  allSlides().forEach(s=>s.classList.remove('active'));
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
function showSlide(i){
  const S = allSlides();
  cur = Math.max(0, Math.min(S.length-1, i));
  S.forEach((s,n)=>s.classList.toggle('active', n===cur));
  document.getElementById('pbar').style.width = ((cur+1)/S.length*100)+'%';
  document.getElementById('pcount').textContent = (cur+1)+' / '+S.length;
  const active = S[cur];
  active.querySelectorAll('.bar-fill').forEach((b,n)=>
    setTimeout(()=>b.style.width=b.dataset.w+'%', 90+n*100));
}
document.addEventListener('keydown', e=>{
  if(document.body.classList.contains('sheet-open')){ if(e.key==='Escape') closeSheets(); return; }
  if(!document.body.classList.contains('present')) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();showSlide(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();showSlide(cur-1);}
  else if(e.key==='Escape'){exitPresent();}
});
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('present')) exitPresent();
});
